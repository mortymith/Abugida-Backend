# Thin bun test wiring: the shared preload (env safety defaults + custom
# matchers) lives in tooling/bun-test-config. bun only reads bunfig.toml from
# the CWD, so each workspace that runs `bun test` carries this file.
#
# The second preload is the worker's own: it initialises the shared
# observability stack (pino logger + OpenTelemetry) with the exporters
# disabled, because the processors log through it.
[test]
preload = ["@abugida/bun-test-config/preload", "./tests/setup.ts"]
