        '403':
          $ref: '#/components/responses/403'
        '429':
          $ref: '#/components/responses/429'
        '500':
          $ref: '#/components/responses/500'

  /users/me/enrollments:
    get:
      tags: [Progress]
      summary: List user enrollments
      description: |
        Returns all course enrollments for the authenticated user.
        Maps to `learning.enrollments WHERE student_id = :userId AND deleted_at IS NULL`.
        Uses index `idx_enrollments_active`.
      operationId: listEnrollments
      security:
        - bearerAuth: []
      parameters:
        - name: cursor
          in: query
          required: false
          schema:
            type: string
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
        - name: status
          in: query
          required: false
          description: |
            Filter by enrollment status. Derived from DB fields:
            - `NOT_STARTED`: progress_percentage = 0 AND is_completed = false
            - `IN_PROGRESS`: progress_percentage > 0 AND is_completed = false
            - `COMPLETED`: is_completed = true
          schema:
            type: string
            enum: [NOT_STARTED, IN_PROGRESS, COMPLETED]
        - name: source
          in: query
          required: false
          description: Filter by enrollment source (maps to `enrollment_source` enum)
          schema:
            type: string
            enum: [PURCHASE, BUNDLE_PURCHASE, FREE_ACCESS, ADMIN_GRANT, PREVIEW]
      responses:
        '200':
          description: Enrollments retrieved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CursorPaginatedResponse'
        '400':
          $ref: '#/components/responses/400'
        '401':
          $ref: '#/components/responses/401'
        '403':
