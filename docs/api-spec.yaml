    get:
      tags: [Purchases]
      summary: Get purchase details
      description: |
        Returns full purchase details including status, amount, and generated enrollments.
        Maps to `finance.purchases` joined with `finance.purchase_transactions`.
      operationId: getPurchase
      security:
