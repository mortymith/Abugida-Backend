        Maps to `learning.quiz_attempts WHERE student_id = :userId AND lesson_id = :id`.
        Uses index `idx_quiz_attempts_student_lesson`.
      operationId: listQuizAttempts
      security:
        - bearerAuth: []
      parameters:
        - name: resourceId
          in: path
          required: true
          description: UUID v7 identifier of the quiz lesson
          schema:
            $ref: '#/components/schemas/UUIDv7'
