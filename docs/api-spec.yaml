servers:
  - url: https://api.abugada.com/api/v1
    description: Production
  - url: https://api-staging.abugada.com/api/v1
    description: Staging
  - url: https://api-sandbox.abugada.com/api/v1
    description: Development

security:
  - bearerAuth: []

tags:
  - name: Users
    description: User profiles, preferences, onboarding, devices, GDPR operations
    x-fr-series: FR-100, FR-900
  - name: Dashboard
    description: User dashboard with aggregated statistics, activity feed, and insights
    x-fr-series: FR-600, FR-700
  - name: ExamTypes
    description: Exam type hierarchy navigation (self-referencing tree)
    x-fr-series: FR-200
  - name: Resources
    description: Educational resource library — hierarchy navigation, course search
    x-fr-series: FR-200
  - name: Bundles
    description: Course bundles — grouped course packages by exam type
    x-fr-series: FR-200, FR-400
  - name: Progress
    description: User learning progress, enrollments, lesson completions, and study tracking
    x-fr-series: FR-500
  - name: Bookmark
    description: User bookmarks for courses and resources
    x-fr-series: FR-206
  - name: Downloads
    description: Offline course content downloads, download status, and presigned download URLs
    x-fr-series: FR-204
  - name: Purchases
    description: Telebirr-only purchases for courses and bundles, enrollments
    x-fr-series: FR-400, FR-500
  - name: Quiz
    description: Quiz questions, attempts, and answer submission
    x-fr-series: FR-500
  - name: Recommendations
    description: Course ratings, reviews, popularity-based recommendations
    x-fr-series: FR-700
  - name: Webhooks
    description: Incoming webhooks from payment providers and SMS service
    x-fr-series: FR-400, FR-1000
  - name: System
    description: Health checks, metrics, and operational endpoints

x-deprecation-policy:
  minimum-notice-months: 6
  sunset-header: Sunset
  sunset-link-relation: sunset
  description: |
    Deprecation Policy:
    - Endpoints marked `deprecated: true` are scheduled for removal
    - Minimum 6-month notice before endpoint removal
    - Deprecated endpoints include `Sunset` header with removal date
    - Migration guides published at `https://docs.abugada.com/migration`

paths:
  # =========================================================================
  # USERS ENDPOINTS
  # =========================================================================
  /users/me:
    get:
      tags: [Users]
      summary: Get current user profile
      operationId: getMyProfile
      security:
        - bearerAuth: []
      responses:
        '200':
          description: User profile retrieved
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SingleResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/UserProfile'
        '400':
          $ref: '#/components/responses/400'
        '401':
          $ref: '#/components/responses/401'
        '403':
          $ref: '#/components/responses/403'
        '429':
          $ref: '#/components/responses/429'
        '500':
          $ref: '#/components/responses/500'
    patch:
      tags: [Users]
      summary: Update current user profile
      operationId: updateMyProfile
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserProfileUpdate'
      responses:
        '200':
          description: Profile updated successfully
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SingleResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/UserProfile'
        '400':
          $ref: '#/components/responses/400'
        '401':
          $ref: '#/components/responses/401'
        '403':
          $ref: '#/components/responses/403'
        '409':
          $ref: '#/components/responses/409'
        '422':
          $ref: '#/components/responses/422'
        '429':
          $ref: '#/components/responses/429'
        '500':
          $ref: '#/components/responses/500'
    delete:
      tags: [Users]
      summary: Delete current user account
      description: Initiate GDPR account deletion (queued, async)
      operationId: deleteMyAccount
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AccountDeletionRequest'
      responses:
        '202':
          description: Deletion queued
        '400':
          $ref: '#/components/responses/400'
        '401':
          $ref: '#/components/responses/401'
        '403':
          $ref: '#/components/responses/403'
        '409':
          $ref: '#/components/responses/409'
        '429':
          $ref: '#/components/responses/429'
        '500':
          $ref: '#/components/responses/500'

  /users/me/onboarding:
    get:
      tags: [Users]
      summary: Get onboarding progress
      operationId: getOnboarding
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Onboarding state retrieved
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SingleResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/OnboardingState'
        '400':
          $ref: '#/components/responses/400'
        '401':
          $ref: '#/components/responses/401'
        '403':
          $ref: '#/components/responses/403'
        '429':
          $ref: '#/components/responses/429'
        '500':
          $ref: '#/components/responses/500'
    post:
      tags: [Users]
      summary: Update onboarding progress
      operationId: updateOnboarding
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OnboardingStepUpdate'
      responses:
        '200':
          description: Onboarding updated
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SingleResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/OnboardingState'
        '400':
          $ref: '#/components/responses/400'
        '401':
          $ref: '#/components/responses/401'
        '403':
          $ref: '#/components/responses/403'
        '409':
          $ref: '#/components/responses/409'
        '422':
          $ref: '#/components/responses/422'
        '429':
          $ref: '#/components/responses/429'
        '500':
          $ref: '#/components/responses/500'

  /users/me/onboarding/retrigger:
    post:
      tags: [Users]
      summary: Retrigger onboarding flow
      operationId: retriggerOnboarding
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OnboardingRetriggerRequest'
      responses:
        '200':
          description: Onboarding retriggered
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SingleResponse'
        '400':
          $ref: '#/components/responses/400'
        '401':
          $ref: '#/components/responses/401'
        '403':
          $ref: '#/components/responses/403'
        '409':
          $ref: '#/components/responses/409'
        '422':
          $ref: '#/components/responses/422'
        '429':
          $ref: '#/components/responses/429'
        '500':
          $ref: '#/components/responses/500'

  /users/me/consents:
    get:
      tags: [Users]
      summary: Get user consent records
      operationId: getConsents
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Consents retrieved
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SingleResponse'
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/ConsentRecord'
        '400':
          $ref: '#/components/responses/400'
        '401':
          $ref: '#/components/responses/401'
        '403':
          $ref: '#/components/responses/403'
        '429':
          $ref: '#/components/responses/429'
        '500':
          $ref: '#/components/responses/500'
    put:
      tags: [Users]
      summary: Update user consents
      description: |
        Updates consent preferences. Creates new immutable consent records in
        `auth.user_consents`. The `essential` consent type is always granted and
        cannot be modified via this endpoint.

        **Enum mapping:** Request values (UPPER_SNAKE_CASE) are mapped to DB
        lowercase values by the service layer. The `ESSENTIAL` type is excluded
        from this endpoint as it is non-modifiable.
      operationId: updateConsents
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConsentUpdate'
      responses:
        '200':
          description: Consents updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SingleResponse'
        '400':
          $ref: '#/components/responses/400'
        '401':
          $ref: '#/components/responses/401'
        '403':
          $ref: '#/components/responses/403'
        '409':
          $ref: '#/components/responses/409'
        '422':
          $ref: '#/components/responses/422'
        '429':
          $ref: '#/components/responses/429'
        '500':
          $ref: '#/components/responses/500'

  /users/me/export:
    get:
      tags: [Users]
      summary: Export user data
      description: GDPR data export (FR-904) - returns streaming JSON or CSV
      operationId: exportData
      security:
        - bearerAuth: []
      parameters:
        - name: include
          in: query
          schema:
            type: array
            items:
              type: string
              enum: [PROFILE, PROGRESS, PURCHASES, CONSENTS]
        - name: format
          in: query
          schema:
            type: string
            enum: [JSON, CSV]
            default: JSON
      responses:
        '200':
          description: Export in progress (streaming)
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                  meta:
                    $ref: '#/components/schemas/ResponseMetadata'
        '400':
          $ref: '#/components/responses/400'
        '401':
          $ref: '#/components/responses/401'
        '403':
          $ref: '#/components/responses/403'
        '429':
          $ref: '#/components/responses/429'
        '500':
          $ref: '#/components/responses/500'

  /users/me/devices:
    get:
      tags: [Users]
      summary: Get registered devices
      operationId: getDevices
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Devices retrieved
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SingleResponse'
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/Device'
        '400':
          $ref: '#/components/responses/400'
        '401':
          $ref: '#/components/responses/401'
        '403':
          $ref: '#/components/responses/403'
        '429':
          $ref: '#/components/responses/429'
        '500':
          $ref: '#/components/responses/500'
    post:
      tags: [Users]
      summary: Register a new device
      description: Enforces 3-device limit per user account (`auth.users.max_devices`).
      operationId: registerDevice
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeviceRegistrationRequest'
      responses:
        '201':
          description: Device registered
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SingleResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/Device'
        '400':
          $ref: '#/components/responses/400'
        '401':
          $ref: '#/components/responses/401'
        '403':
          $ref: '#/components/responses/403'
        '409':
          description: Device limit exceeded — maximum 3 devices per account
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
        '422':
          $ref: '#/components/responses/422'
        '429':
          $ref: '#/components/responses/429'
        '500':
          $ref: '#/components/responses/500'

  /users/me/devices/{deviceId}:
    patch:
      tags: [Users]
      summary: Update device details
      description: Update device name or mark as inactive.
      operationId: updateDevice
      security:
        - bearerAuth: []
      parameters:
        - name: deviceId
          in: path
          required: true
          description: UUID v7 identifier of the device
          schema:
            $ref: '#/components/schemas/UUIDv7'
          example: 018f3a2c-9b5e-7d4a-a1c2-e3f4a5b6c7d8
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeviceUpdateRequest'
      responses:
        '200':
          description: Device updated
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SingleResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/Device'
        '400':
          $ref: '#/components/responses/400'
        '401':
          $ref: '#/components/responses/401'
        '403':
          $ref: '#/components/responses/403'
        '404':
          $ref: '#/components/responses/404'
        '409':
          $ref: '#/components/responses/409'
        '422':
          $ref: '#/components/responses/422'
        '429':
          $ref: '#/components/responses/429'
        '500':
          $ref: '#/components/responses/500'
    delete:
      tags: [Users]
      summary: Remove a device
      operationId: removeDevice
      security:
        - bearerAuth: []
      parameters:
        - name: deviceId
          in: path
          required: true
          description: UUID v7 identifier of the device
          schema:
            $ref: '#/components/schemas/UUIDv7'
          example: 018f3a2c-9b5e-7d4a-a1c2-e3f4a5b6c7d8
      responses:
        '204':
          description: Device removed
        '400':
          $ref: '#/components/responses/400'
        '401':
          $ref: '#/components/responses/401'
        '403':
          $ref: '#/components/responses/403'
        '404':
          $ref: '#/components/responses/404'
        '409':
          $ref: '#/components/responses/409'
        '429':
          $ref: '#/components/responses/429'
        '500':
          $ref: '#/components/responses/500'

  # =========================================================================
  # DASHBOARD ENDPOINTS
  # =========================================================================
  /users/me/dashboard:
    get:
      tags: [Dashboard]
      summary: Get user dashboard data
      description: |
        Aggregated dashboard data for the user's home screen. This single endpoint provides
        all necessary data for the dashboard view, reducing the need for multiple API calls.

        **Includes:**
        - User statistics (study time, lessons, XP, streak)
        - Recent activity feed
        - Key insights and achievements
        - Weekly study data
        - Upcoming deadlines
        - Jump-back course recommendation

        **Performance:** Cached for 60 seconds to reduce database load.

        **DB Note:** XP, streak, sessions, deadlines, and achievements are computed
        service-side from `learning.enrollments`, `learning.lesson_completions`, and
        `catalog.course_stats`. No dedicated DB tables required for these aggregations.
      operationId: getDashboard
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Dashboard data retrieved
          headers:
            Cache-Control:
              schema:
                type: string
                example: private, max-age=60
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SingleResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/DashboardData'
        '400':
          $ref: '#/components/responses/400'
        '401':
          $ref: '#/components/responses/401'
        '403':
          $ref: '#/components/responses/403'
        '429':
          $ref: '#/components/responses/429'
        '500':
          $ref: '#/components/responses/500'

  # =========================================================================
  # EXAM TYPES ENDPOINTS
  # =========================================================================
  /exam-types:
    get:
      tags: [ExamTypes]
      summary: List top-level exam types
      description: |
        Public endpoint. Returns all top-level exam types (where `parent_exam_type_id IS NULL`)
        with cursor-based pagination. Maps to `catalog.exam_types` with `depth = 0`.

        **DB Alignment:** `catalog.exam_types` is a self-referencing hierarchy.
        Top-level items represent major education categories; children represent sub-categories.
      operationId: listExamTypes
      parameters:
        - name: cursor
          in: query
          required: false
          description: |
            Opaque cursor for retrieving the next page of results.
            Obtained from the `meta.nextCursor` field of a previous paginated response.
            Omit or set to empty string to retrieve the first page.
          schema:
            type: string
        - name: limit
          in: query
          required: false
          description: 'Maximum number of items to return per page. Default: 20, Min: 1, Max: 100'
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
          example: 20
        - name: include_children
          in: query
          required: false
          description: If true, includes immediate children nested under each exam type.
          schema:
            type: boolean
            default: false
      responses:
        '200':
          description: Exam types retrieved
          headers:
            Cache-Control:
              schema:
                type: string
                example: public, max-age=3600
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CursorPaginatedResponse'
        '400':
          $ref: '#/components/responses/400'
        '401':
