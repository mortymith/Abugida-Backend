      tags: [Progress]
      summary: Mark a lesson as complete or incomplete
      description: |
        Toggles lesson completion status within an enrollment.
        Maps to `learning.lesson_completions` (upsert on student_id + lesson_id).
        On completion, triggers recalculation of `enrollments.progress_percentage`.
        The `row_version` on the enrollment is incremented for optimistic concurrency.
