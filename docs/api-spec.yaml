openapi: 3.0.0
info:
  title: Abugida Application API
  description: |
    # Overview

    **Error Responses:** All 4xx and 5xx responses use `application/problem+json`
    content-type per [RFC 9457](https://www.rfc-editor.org/rfc/rfc9457).

    Unified REST API for the **Abugida Application** — a comprehensive learning platform
    supporting examination preparation across multiple education segments.

    **Ethiopian users only. All prices in Ethiopian Birr (ETB). Telebirr is the sole payment method.**

    ## API Versioning

    All endpoints are versioned via the URL path prefix `/api/v1/`. Breaking changes will
    increment the version number. Non-breaking additions may be introduced within v1.

    ## Authentication

    Authentication endpoints (`/auth/*`) are provided by **Better Auth** framework.
    The API uses **JWT Bearer tokens** for user authentication:
    - Sign-in providers: **Google Sign-In** and **Apple ID**
    - Access and refresh token lifecycle managed by Better Auth
    - Include as: `Authorization: Bearer <access_token>`

    Webhook endpoints use **API Key** authentication via the `X-API-Key` header.

    ## Response Envelope

    All successful responses follow a consistent envelope:

    **Single resource:**
    ```json
    {
      "data": { ... },
      "meta": {
        "requestId": "uuid-v7",
        "timestamp": "2026-04-30T10:30:00Z"
      }
    }
    ```

    **Collection with cursor pagination:**
    ```json
    {
      "data": [ ... ],
      "meta": {
        "requestId": "uuid-v7",
        "timestamp": "2026-04-30T10:30:00Z",
        "hasNextPage": true,
        "nextCursor": "base64url-encoded-cursor",
        "limit": 20
      }
    }
    ```

    ## Error Format

    All errors follow [RFC 7807 Problem Details](https://tools.ietf.org/html/rfc7807):
    ```json
    {
      "type": "https://api.example.com/errors/invalid-parameter",
      "title": "Invalid Parameter",
      "status": 400,
      "detail": "The 'email' field must be a valid email address.",
      "instance": "/api/v1/users/me",
      "correlationId": "01JQXYZ..."
    }
    ```

    ## Rate Limiting

    Per NFR-403:
    - **Authenticated users:** 100 requests per minute
    - **Unauthenticated IPs:** 1000 requests per minute

    Rate limit status is returned in response headers:
    - `X-RateLimit-Limit`: Maximum requests per window
    - `X-RateLimit-Remaining`: Requests remaining in current window
    - `X-RateLimit-Reset`: Unix timestamp when the window resets

    When exceeded, the API returns `429 Too Many Requests` with a `Retry-After` header.

    ## Cross-Origin Resource Sharing (CORS)

    The API supports CORS for web client and mobile WebView integrations:

    | Header | Value |
    |--------|-------|
    | `Access-Control-Allow-Origin` | `https://app.abugada.com`, `capacitor://localhost` (mobile), `ionic://localhost` (mobile) |
    | `Access-Control-Allow-Methods` | `GET, POST, PATCH, PUT, DELETE, OPTIONS` |
    | `Access-Control-Allow-Headers` | `Authorization, Content-Type, X-Request-ID, Accept, X-API-Key` |
    | `Access-Control-Expose-Headers` | `X-RateLimit-Limit, X-RateLimit-Remaining, X-RateLimit-Reset, Retry-After, X-Request-ID, ETag, Link` |
    | `Access-Control-Max-Age` | `86400` (24 hours) |
    | `Access-Control-Allow-Credentials` | `true` |

    Preflight `OPTIONS` requests are handled automatically by the API gateway and do not
    require explicit endpoint definitions. Native mobile apps using platform HTTP clients
    (URLSession on iOS, OkHttp on Android) are not affected by CORS policies.

    ## Request Size Limits

    | Limit | Value | Applies To |
    |-------|-------|------------|
    | Maximum request body size | 10 MB | All `application/json` requests |
    | Maximum file upload size | 100 MB | `multipart/form-data` uploads (admin resource creation) |
    | Maximum PDF file size | 5 MB | PDF extraction for indexing (per FR-308) |
    | Maximum course download size | 500 MB | Course content bundles (compressed, per FR-204) |
    | Maximum review length | 2,000 characters | `POST /courses/{id}/reviews` body |
    | Maximum quiz answer length | 10,000 characters | `POST /resources/{id}/quiz/submit` body |

    Requests exceeding these limits receive `413 Payload Too Large`.

    ## Conditional Requests & Caching

    Resource endpoints (`GET /resources/{id}`) support conditional requests via `ETag` and `If-None-Match` headers:

    **Response Headers:**

    | Header | Description |
    |--------|-------------|
    | `ETag` | Entity tag based on `row_version` (format: `W/"<row_version>"`) |
    | `Last-Modified` | Timestamp of last resource update |
    | `Cache-Control` | `private, max-age=300` (5 minutes for authenticated content) |

    **Conditional Request Flow:**
    1. Client receives `ETag: W/"3"` on first request (row_version = 3)
    2. Client sends `If-None-Match: W/"3"` on subsequent requests
    3. If resource unchanged: `304 Not Modified` (no body, saves bandwidth)
    4. If resource updated: `200 OK` with new `ETag` and full body

    **Supported on:** `GET /resources/{id}`, `GET /courses/{courseId}`, `GET /courses/{courseId}/modules`.

    Public endpoints (`GET /exam-types`, `GET /search/courses`) support `Cache-Control: public, max-age=3600` (1 hour).

    ## Pagination

    All collection endpoints use **cursor-based pagination**:
    - `?cursor=<opaque-cursor>&limit=<1-100>`
    - Default limit: 20
    - Maximum limit: 100
    - Response includes `nextCursor` when more results exist

    ## Content Types

    - **Requests:** `application/json` (except file uploads: `multipart/form-data`)
    - **Responses:** `application/json` or `application/problem+json` for errors
    - **File downloads:** Binary with appropriate MIME type
    - **CSV exports:** `text/csv`

    ## Compliance

    - **GDPR:** User data export (JSON) within 7 days; deletion within 30 days (FR-904)
    - **CCPA:** Opt-out mechanisms via consent management (FR-905)
    - **OWASP Top 10:** Weekly automated security scanning (NFR-401)
    - **Data retention:** Audit logs 1 year

    ## Third-Party Integrations

    | Service | Purpose | Availability |
    |---------|---------|-------------|
    | Better Auth | OAuth/authentication framework (Google + Apple ID) | Production only |
    | SMSEthiopia | SMS payment confirmations | Production only |
    | Telebirr C2B | Sole payment method (all platforms) | Production only |

    ## Enum Serialization Convention

    All enum values are transmitted as **UPPER_SNAKE_CASE** in both requests and responses
    (e.g., `IOS`, `ANDROID`, `WEB`). The API gateway serializes/deserializes to/from the
    database's lowercase snake_case storage format transparently. Clients never need to
    handle lowercase enum values.

    **References:**
    - [Software Requirements Specification v1.0](./SRS.md)
    - [Database Schema v4.0](./db.txt)
    - [API Generation Plan](./re.md)

  version: 2.0.0
  termsOfService: https://abugada.com/terms
  contact:
    name: Abugida API Support Team
    email: api-support@abugada.com
    url: https://abugada.com/developers
