  # =========================================================================
  # SEARCH ENDPOINTS
  # =========================================================================
  /search/courses:
    get:
      tags: [Resources]
      summary: Search for courses
      description: |
        Course-Centric Search optimized for finding courses across the platform.

        **Search Strategy:**
        - Primary: Full-text search on course title, description
        - Secondary: Filter by exam type hierarchy and tags
        - Tertiary: Sort by relevance, rating, popularity, or price

        **DB Alignment:** Full-text search uses `catalog.lessons.search_vector` GIN index
        aggregated at course level. Filters map to `catalog.courses` columns and
        `catalog.course_tag_assignments`.
      operationId: searchCourses
      parameters:
        - name: q
          in: query
          required: false
          description: Keyword search query (min 2 characters)
          schema:
            type: string
            minLength: 2
            maxLength: 200
          example: atomic structure
        - name: fuzzy
          in: query
          required: false
          description: Enable fuzzy matching (trigram similarity)
          schema:
            type: boolean
            default: false
        - name: exam_type
          in: query
          required: false
          description: Filter by exam type ID (includes children recursively)
          schema:
            $ref: '#/components/schemas/UUIDv7'
        - name: tags
          in: query
          required: false
          description: Filter by tag IDs (comma-separated)
          schema:
            type: array
            items:
              $ref: '#/components/schemas/UUIDv7'
        - name: sort
          in: query
          required: false
          schema:
            type: string
            enum: [relevance, rating, popularity, newest, price_low, price_high]
            default: relevance
        - name: min_price
          in: query
          required: false
          description: Minimum price in ETB
          schema:
            type: number
            minimum: 0
        - name: max_price
          in: query
          required: false
          description: Maximum price in ETB
          schema:
            type: number
            minimum: 0
        - name: free_only
          in: query
          required: false
          description: Only return free courses (maps to `courses.is_free`)
          schema:
            type: boolean
            default: false
        - name: cursor
          in: query
          required: false
          schema:
            type: string
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
      responses:
        '200':
          description: Course search results retrieved
          headers:
            Cache-Control:
              schema:
                type: string
                example: public, max-age=60
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CursorPaginatedResponse'
        '400':
          $ref: '#/components/responses/400'
        '401':
          $ref: '#/components/responses/401'
        '403':
          $ref: '#/components/responses/403'
        '429':
          $ref: '#/components/responses/429'
        '500':
          $ref: '#/components/responses/500'

  /search/bundles:
    get:
      tags: [Bundles]
      summary: Search for bundles
      description: |
        Search bundles by keyword, exam type, or price range.
        Maps to `catalog.course_bundles` with full-text on title/description.
      operationId: searchBundles
      parameters:
        - name: q
          in: query
          required: false
          schema:
            type: string
            minLength: 2
            maxLength: 200
        - name: exam_type
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/UUIDv7'
        - name: min_price
          in: query
          required: false
          schema:
            type: number
            minimum: 0
        - name: max_price
          in: query
          required: false
          schema:
            type: number
            minimum: 0
        - name: sort
          in: query
          required: false
          schema:
            type: string
            enum: [relevance, newest, price_low, price_high, discount]
            default: relevance
        - name: cursor
          in: query
          required: false
