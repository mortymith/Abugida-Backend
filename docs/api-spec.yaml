security:
  - bearerAuth: []
  - apiKeyHeader: []

tags:
  - name: Users
    description: User profiles, preferences, onboarding, devices, GDPR operations
    x-fr-series: FR-100, FR-900
  - name: Dashboard
    description: User dashboard with aggregated statistics, activity feed, and insights
    x-fr-series: FR-600, FR-700
  - name: Resources
    description: Educational resource library - hierarchy navigation, course search
    x-fr-series: FR-200
  - name: Progress
    description: User learning progress, enrollments, and study tracking
    x-fr-series: FR-500
  - name: Bookmark
    description: User bookmarks for courses and resources
    x-fr-series: FR-206
  - name: Downloads
    description: Offline course content downloads, download status, and presigned download URLs
    x-fr-series: FR-204
  - name: Purchases
    description: Telebirr-only purchases, enrollments
    x-fr-series: FR-400, FR-500
  - name: Recommendations
    description: Course ratings, reviews, popularity-based recommendations
    x-fr-series: FR-700
  - name: Webhooks
    description: Incoming webhooks from payment providers and SMS service
    x-fr-series: FR-400, FR-1000
  - name: System
    description: Health checks, metrics, and operational endpoints

x-target-segments:
  - name: TOEFL/IGCSE
    priority: primary
    features: full
  - name: High School
    priority: secondary
    features: core
  - name: College
    priority: tertiary
    features: readonly

x-deprecation-policy:
  minimum-notice-months: 6
  sunset-header: Sunset
  sunset-link-relation: sunset
  description: |
    **Deprecation Policy:**

    - Endpoints marked `deprecated: true` are scheduled for removal
    - Minimum 6-month notice before endpoint removal
    - Deprecated endpoints include `Sunset` header with removal date
    - Migration guides published at `https://docs.example.com/migration`

    **Sunset Header Example:**
    ```
    Sunset: Sat, 31 Dec 2026 23:59:59 GMT
    Link: <https://docs.example.com/migration/v1-to-v2>; rel="sunset"
    ```

paths:
  # ======================================================================
  # USERS ENDPOINTS
  # ======================================================================
  /users/me:
    get:
      tags:
        - Users
      summary: Get current user profile
      operationId: getMyProfile
      security:
        - bearerAuth: []
      responses:
        '200':
          description: User profile retrieved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SingleResponse'
        '400':
          $ref: '#/components/responses/400'
        '401':
          $ref: '#/components/responses/401'
        '403':
          $ref: '#/components/responses/403'
        '429':
          $ref: '#/components/responses/429'
        '500':
          $ref: '#/components/responses/500'

    patch:
      tags:
        - Users
      summary: Update current user profile
      operationId: updateMyProfile
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserProfileUpdate'
      responses:
        '200':
          description: Profile updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SingleResponse'
        '400':
          $ref: '#/components/responses/400'
        '401':
          $ref: '#/components/responses/401'
        '403':
          $ref: '#/components/responses/403'
        '409':
          $ref: '#/components/responses/409'
        '422':
          $ref: '#/components/responses/422'
        '429':
          $ref: '#/components/responses/429'
        '500':
          $ref: '#/components/responses/500'

    delete:
      tags:
        - Users
      summary: Delete current user account
      description: Initiate GDPR account deletion (queued, async)
      operationId: deleteMyAccount
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AccountDeletionRequest'
      responses:
        '202':
          description: Deletion queued
        '400':
          $ref: '#/components/responses/400'
        '401':
          $ref: '#/components/responses/401'
        '403':
          $ref: '#/components/responses/403'
        '409':
          $ref: '#/components/responses/409'
        '429':
          $ref: '#/components/responses/429'
        '500':
          $ref: '#/components/responses/500'

  /users/me/onboarding:
    get:
      tags:
        - Users
      summary: Get onboarding progress
      operationId: getOnboarding
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Onboarding state retrieved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SingleResponse'
        '400':
          $ref: '#/components/responses/400'
        '401':
          $ref: '#/components/responses/401'
        '403':
          $ref: '#/components/responses/403'
        '429':
          $ref: '#/components/responses/429'
        '500':
          $ref: '#/components/responses/500'

    post:
      tags:
        - Users
      summary: Update onboarding progress
      operationId: updateOnboarding
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OnboardingStepUpdate'
      responses:
        '200':
          description: Onboarding updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SingleResponse'
        '400':
          $ref: '#/components/responses/400'
        '401':
          $ref: '#/components/responses/401'
        '403':
          $ref: '#/components/responses/403'
        '409':
          $ref: '#/components/responses/409'
        '422':
          $ref: '#/components/responses/422'
        '429':
          $ref: '#/components/responses/429'
        '500':
          $ref: '#/components/responses/500'

  /users/me/onboarding/retrigger:
    post:
      tags:
        - Users
      summary: Retrigger onboarding flow
      operationId: retriggerOnboarding
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OnboardingRetriggerRequest'
      responses:
        '200':
          description: Onboarding retriggered
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SingleResponse'
        '400':
          $ref: '#/components/responses/400'
        '401':
          $ref: '#/components/responses/401'
        '403':
          $ref: '#/components/responses/403'
        '409':
          $ref: '#/components/responses/409'
        '422':
          $ref: '#/components/responses/422'
        '429':
          $ref: '#/components/responses/429'
        '500':
          $ref: '#/components/responses/500'

  /users/me/consents:
    get:
      tags:
        - Users
      summary: Get user consent records
      operationId: getConsents
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Consents retrieved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SingleResponse'
        '400':
          $ref: '#/components/responses/400'
        '401':
          $ref: '#/components/responses/401'
        '403':
          $ref: '#/components/responses/403'
        '429':
          $ref: '#/components/responses/429'
        '500':
          $ref: '#/components/responses/500'

    put:
      tags:
        - Users
      summary: Update user consents
      operationId: updateConsents
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConsentUpdate'
      responses:
        '200':
          description: Consents updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SingleResponse'
        '400':
          $ref: '#/components/responses/400'
        '401':
          $ref: '#/components/responses/401'
        '403':
          $ref: '#/components/responses/403'
        '409':
          $ref: '#/components/responses/409'
        '422':
          $ref: '#/components/responses/422'
        '429':
          $ref: '#/components/responses/429'
        '500':
          $ref: '#/components/responses/500'

  /users/me/export:
    get:
      tags:
        - Users
      summary: Export user data
      description: GDPR data export (FR-904) - returns streaming JSON or CSV
      operationId: exportData
      security:
        - bearerAuth: []
      parameters:
        - name: include
          in: query
          schema:
            type: array
            items:
              type: string
              enum:
                - PROFILE
                - PROGRESS
                - PURCHASES
                - CONSENTS
        - name: format
          in: query
          schema:
            type: string
            enum:
              - JSON
              - CSV
            default: JSON
      responses:
        '200':
          description: Export in progress (streaming)
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                  meta:
                    $ref: '#/components/schemas/ResponseMetadata'
        '400':
          $ref: '#/components/responses/400'
        '401':
          $ref: '#/components/responses/401'
        '403':
          $ref: '#/components/responses/403'
        '429':
          $ref: '#/components/responses/429'
        '500':
          $ref: '#/components/responses/500'

  /users/me/devices:
    get:
      tags:
        - Users
      summary: Get registered devices
      operationId: getDevices
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Devices retrieved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SingleResponse'
        '400':
          $ref: '#/components/responses/400'
        '401':
          $ref: '#/components/responses/401'
        '403':
          $ref: '#/components/responses/403'
        '429':
          $ref: '#/components/responses/429'
        '500':
          $ref: '#/components/responses/500'

    post:
      tags:
        - Users
      summary: Register a new device
      description: Enforces 3-device limit per user account.
      operationId: registerDevice
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeviceRegistrationRequest'
      responses:
        '201':
          description: Device registered
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SingleResponse'
        '400':
          $ref: '#/components/responses/400'
        '401':
          $ref: '#/components/responses/401'
        '403':
          $ref: '#/components/responses/403'
        '409':
          description: Device limit exceeded — maximum 3 devices per account
        '422':
          $ref: '#/components/responses/422'
        '429':
          $ref: '#/components/responses/429'
        '500':
          $ref: '#/components/responses/500'

  /users/me/devices/{deviceId}:
    patch:
      tags:
        - Users
      summary: Update device details
      description: Update device name or mark as inactive.
      operationId: updateDevice
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/deviceId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeviceUpdateRequest'
      responses:
        '200':
          description: Device updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SingleResponse'
        '400':
          $ref: '#/components/responses/400'
        '401':
          $ref: '#/components/responses/401'
        '403':
          $ref: '#/components/responses/403'
        '404':
          $ref: '#/components/responses/404'
        '409':
          $ref: '#/components/responses/409'
        '422':
          $ref: '#/components/responses/422'
        '429':
          $ref: '#/components/responses/429'
        '500':
          $ref: '#/components/responses/500'

    delete:
      tags:
        - Users
      summary: Remove a device
      operationId: removeDevice
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/deviceId'
      responses:
        '204':
          description: Device removed
        '400':
          $ref: '#/components/responses/400'
        '401':
          $ref: '#/components/responses/401'
        '403':
          $ref: '#/components/responses/403'
        '404':
          $ref: '#/components/responses/404'
        '409':
          $ref: '#/components/responses/409'
        '429':
          $ref: '#/components/responses/429'
        '500':
          $ref: '#/components/responses/500'

  # ======================================================================
  # DASHBOARD ENDPOINTS
  # ======================================================================
  /users/me/dashboard:
    get:
      tags:
        - Dashboard
      summary: Get user dashboard data
      description: |
        Aggregated dashboard data for the user's home screen. This single endpoint provides
        all necessary data for the dashboard view, reducing the need for multiple API calls.
        
        **Includes:**
        - User statistics (study time, lessons, XP, streak)
        - Recent activity feed
        - Key insights and achievements
        - Weekly study data
        - Upcoming deadlines
        - Jump-back course recommendation
        
        **Performance:** Cached for 60 seconds to reduce database load.
      operationId: getDashboard
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Dashboard data retrieved
          headers:
            Cache-Control:
              schema:
                type: string
                example: private, max-age=60
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SingleResponse'
        '400':
          $ref: '#/components/responses/400'
        '401':
          $ref: '#/components/responses/401'
        '403':
          $ref: '#/components/responses/403'
        '429':
          $ref: '#/components/responses/429'
        '500':
          $ref: '#/components/responses/500'

  # ======================================================================
  # RESOURCES ENDPOINTS
  # ======================================================================
  /education-levels:
    get:
      tags:
        - Resources
      summary: List education levels
      description: |
        Public endpoint. Returns all education levels with cursor-based pagination.
        Cursor pagination is used here (rather than a fixed collection) because the
        number of education levels may grow over time as new exam types are added.
      operationId: listEducationLevels
      parameters:
        - $ref: '#/components/parameters/cursor'
        - $ref: '#/components/parameters/limit'
      responses:
        '200':
          description: Education levels retrieved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CursorPaginatedResponse'
        '400':
          $ref: '#/components/responses/400'
        '401':
          $ref: '#/components/responses/401'
        '403':
          $ref: '#/components/responses/403'
        '429':
          $ref: '#/components/responses/429'
        '500':
          $ref: '#/components/responses/500'

  /education-levels/{levelId}/exam-types:
    get:
      tags:
        - Resources
      summary: List exam types for an education level
      description: |
        Returns all exam types for the given education level as a fixed collection
        (no cursor pagination). Exam types per level are a small, bounded set
        (typically 2–5 items), so cursor pagination is not necessary here.
      operationId: listExamTypes
      parameters:
        - $ref: '#/components/parameters/levelId'
      responses:
        '200':
          description: Exam types retrieved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CollectionResponse'
        '400':
          $ref: '#/components/responses/400'
        '401':
          $ref: '#/components/responses/401'
        '403':
          $ref: '#/components/responses/403'
        '404':
          $ref: '#/components/responses/404'
        '429':
          $ref: '#/components/responses/429'
        '500':
          $ref: '#/components/responses/500'

  /exam-types/{examTypeId}/courses:
    get:
      tags:
        - Resources
      summary: List courses for an exam type
      operationId: listCourses
      parameters:
        - $ref: '#/components/parameters/examTypeId'
        - $ref: '#/components/parameters/cursor'
        - $ref: '#/components/parameters/limit'
        - name: sort
          in: query
          schema:
            type: string
            enum:
              - rating
              - popularity
              - newest
              - price_low
              - price_high
      responses:
        '200':
          description: Courses retrieved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CursorPaginatedResponse'
        '400':
          $ref: '#/components/responses/400'
        '401':
          $ref: '#/components/responses/401'
        '403':
          $ref: '#/components/responses/403'
        '404':
          $ref: '#/components/responses/404'
        '429':
          $ref: '#/components/responses/429'
        '500':
          $ref: '#/components/responses/500'

  /courses/{courseId}:
    get:
      tags:
        - Resources
      summary: Get course details
      operationId: getCourse
      parameters:
        - $ref: '#/components/parameters/courseId'
      responses:
        '200':
          description: Course details retrieved
          headers:
