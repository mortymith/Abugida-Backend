  # SYSTEM ENDPOINTS
  # ======================================================================
  /health:
    get:
      tags:
        - System
      summary: Liveness probe
      description: |
        Returns 200 OK if the application process is running.
        No authentication required. No dependency checks performed.
        Used by Kubernetes liveness probes and load balancer health checks.
      operationId: healthLiveness
      security: []
      responses:
        '200':
          description: Service is alive
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    enum:
                      - ok
                    example: ok
                  uptime:
                    type: number
                    description: Process uptime in seconds
                    example: 123456.78
                  version:
                    type: string
                    description: Deployed API version
                    example: 1.0.0
                  timestamp:
                    $ref: '#/components/schemas/Timestamp'
                required:
                  - status
                  - uptime
                  - version
                  - timestamp
        '400':
          $ref: '#/components/responses/400'
        '500':
          $ref: '#/components/responses/500'

  /health/ready:
    get:
      tags:
        - System
      summary: Readiness probe
      description: |
        Returns 200 OK only if all critical dependencies are available.
        Checks database connectivity, SMS provider,
        and payment gateway status. Used by Kubernetes readiness probes.
        Returns 503 if any dependency is unavailable.
      operationId: healthReadiness
      security: []
      responses:
        '200':
          description: All dependencies available
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    enum:
                      - ok
                    example: ok
                  checks:
                    type: object
                    properties:
                      database:
                        type: string
                        enum:
                          - ok
                          - degraded
                          - unavailable
                        description: PostgreSQL connection and query health
                        example: ok
                      sms_provider:
                        type: string
                        enum:
                          - ok
                          - degraded
                          - unavailable
                        description: SMSEthiopia API reachability
                        example: ok
                      payment_gateway:
                        type: string
                        enum:
                          - ok
                          - degraded
                          - unavailable
                        description: Telebirr payment service
                        example: ok
                    required:
                      - database
                      - sms_provider
                      - payment_gateway
                  timestamp:
                    $ref: '#/components/schemas/Timestamp'
                required:
                  - status
                  - checks
                  - timestamp
        '400':
          $ref: '#/components/responses/400'
        '503':
          description: One or more dependencies unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
                example:
                  type: https://api.example.com/errors/service-unavailable
                  title: Service Unavailable
                  status: 503
                  detail: 'Dependency check failed: database is unavailable.'
                  instance: /api/v1/health/ready
                  correlationId: 018f3a2c-9b5e-7d4a-a1c2-e3f4a5b6c7d8

components:
  # ======================================================================
  # SECURITY SCHEMES
  # ======================================================================
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        **JWT Bearer Token Authentication**

        Obtain tokens via:
        - Login — Returns `{ accessToken, refreshToken, expiresIn }`
        - Register — Returns tokens for immediate authentication after signup
        - Token refresh — Rotates tokens using a valid refresh token

        **Token Lifecycle:**
        - Access token: 24 hours (configurable via `ops.system_configs`)
        - Refresh token: 7 days with rotation on each use
        - Token family rotation: Using a refresh token invalidates all tokens in the same family

        **Usage:**
        ```
        Authorization: Bearer eyJhbGciOiJIUzI1NiIs...
        ```

        **Security (FR-901):**
        - Authentication via Better Auth (Telegram + Google OAuth)
        - JWT/session lifecycle governed by Better Auth configuration
        - No custom token implementation — Better Auth manages all auth flows

        **Related Functional Requirements:**
        - FR-103: Login with phone + password
        - FR-107: Account lockout after 5 failed attempts
        - FR-108: Logout invalidates all tokens
        - FR-901: Secure authentication enforcement
        - NFR-402: Session timeout after 15 minutes inactivity

    apiKeyHeader:
      type: apiKey
      in: header
      name: X-API-Key
      description: |
        **API Key Authentication for Webhooks**

        Used by third-party services to authenticate incoming webhook calls:
        - Telebirr C2B payment callbacks
        - SMSEthiopia delivery status callbacks

        **Security Requirements (NFR-TP01):**
        - API keys stored in AWS Secrets Manager / HashiCorp Vault
        - Rotated every 90 days
        - Never exposed in client-side code or build artifacts
        - Validated against `ops.api_keys` table with `principal_type = 'integration'`

        **Usage:**
        ```
        X-API-Key: ek_live_a1b2c3d4e5f6...
        ```

        **Related Requirements:**
        - FR-404: Payment receipt validation
        - FR-1005: SMS delivery confirmation
        - NFR-TP01: Server-side only, never client-exposed

  # ======================================================================
  # SCHEMAS
  # ======================================================================
  schemas:
    # ----- Shared primitives -----
    UUIDv7:
      type: string
      format: uuid
      description: |
        Universally Unique Identifier version 7 (time-ordered, monotonic).

        **Characteristics:**
        - Time-ordered: Sortable by creation time without additional timestamp
        - Monotonic: Guarantees uniqueness within the same millisecond
        - API-safe: Used as public-facing identifier (maps to `public_id` in database)
        - Internal `bigint` primary keys are never exposed in API responses

        Generated via PostgreSQL `uuid_generate_v7()` from the `pg_uuidv7` extension.

        **Example:** `018f3a2c-9b5e-7d4a-a1c2-e3f4a5b6c7d8`
      pattern: ^[0-9a-f]{8}-[0-9a-f]{4}-7[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$
      example: 018f3a2c-9b5e-7d4a-a1c2-e3f4a5b6c7d8

    Timestamp:
      type: string
      format: date-time
      description: |
        ISO 8601 timestamp with timezone offset. All timestamps are stored and returned 
        in UTC with timezone awareness (`timestamptz` in PostgreSQL).

        **Precision:** Millisecond-level precision when available.
        **Example:** `2026-04-30T14:30:00.000Z`
      example: '2026-04-30T14:30:00.000Z'

    CurrencyCode:
      type: string
      pattern: ^[A-Z]{3}$
      description: |
        ISO 4217 three-letter currency code. Supports all world currencies including 
        three-decimal currencies (e.g., Bahraini Dinar, Kuwaiti Dinar).

        **Default:** `ETB` (Ethiopian Birr)
        **Examples:** `ETB`, `USD`, `EUR`, `BHD`
      minLength: 3
      maxLength: 3
      example: ETB

    Money:
      type: object
      description: |
        Monetary value with explicit currency code. Amount is represented as a string 
        to preserve exact decimal precision (mapped to `numeric(19,4)` in PostgreSQL).

        **Precision:** Up to 4 decimal places (supports 3-decimal ISO 4217 currencies)
        **Scale:** 19 total digits, 4 fractional
      properties:
        amount:
          type: string
          pattern: ^\d{1,15}\.\d{1,4}$
          description: Monetary amount as exact decimal string (avoids floating-point issues)
          example: '299.99'
        currency:
          $ref: '#/components/schemas/CurrencyCode'
      required:
        - amount
        - currency

    PaginationCursor:
      type: string
      description: |
        Opaque base64url-encoded cursor for pagination. Cursors encode the last item's 
        sort key and are stable for a given result set order.

        **Implementation:**
        - Encode sort key + tiebreaker (usually `public_id` UUID v7) as JSON → base64url
        - Cursors are not guaranteed across different sort orders or filter combinations
        - Empty cursor or omitted cursor = first page

        **Example:** `eyJ0aW1lc3RhbXAiOiIyMDI2LTA0LTMwVDEwOjAwOjAwWiIsImlkIjoiMDE4Zi4uLiJ9`
      example: eyJ0aW1lc3RhbXAiOiIyMDI2LTA0LTMwVDEwOjAwOjAwWiIsImlkIjoiMDE4ZjNhMmMtOWI1ZS03ZDRhLWExYzItZTNmNGE1YjZjN2Q4In0

    # ----- Response envelopes & errors -----
    ResponseMetadata:
      type: object
      description: |
        Base metadata present in all successful responses.
      properties:
        requestId:
          $ref: '#/components/schemas/UUIDv7'
          description: Unique identifier for this request/response pair
        timestamp:
          $ref: '#/components/schemas/Timestamp'
          description: Server timestamp when the response was generated
      required:
        - requestId
        - timestamp

    SingleResponse:
      description: |
        Envelope for responses containing a single resource.

        **Usage:** GET single resource, POST create, PATCH update
      properties:
        data:
          description: The response payload (schema varies by endpoint)
        meta:
          $ref: '#/components/schemas/ResponseMetadata'
      required:
        - data
        - meta

    CollectionResponse:
      description: |
        Envelope for responses containing a collection with cursor-based pagination.

        **Usage:** GET collections where pagination is not needed (small, fixed-size lists)
      properties:
        data:
          type: array
          description: Array of resources (schema varies by endpoint)
        meta:
          allOf:
            - $ref: '#/components/schemas/ResponseMetadata'
            - type: object
              properties:
                count:
                  type: integer
                  minimum: 0
                  description: Total number of items in this response
              required:
                - count
      required:
        - data
        - meta

    CursorPaginatedResponse:
      description: |
        Envelope for paginated collection responses using cursor-based pagination.

        **Pagination Flow:**
        1. Initial request: `GET /resources?limit=20`
        2. Response includes `nextCursor` if more results exist
        3. Next page: `GET /resources?cursor=<nextCursor>&limit=20`
        4. When `hasNextPage` is `false`, all results have been retrieved

        **Cursor Stability:**
        - Cursors are valid only for the same sort order and filters
        - Changing `sort` or `filter` parameters requires starting from page 1
        - Cursors are opaque and should not be constructed or modified by clients

        **Limit Constraints (per NFR-103):**
        - Default: 20 items
        - Minimum: 1
        - Maximum: 100
      properties:
        data:
          type: array
          description: Array of resources for the current page
        meta:
          allOf:
            - $ref: '#/components/schemas/ResponseMetadata'
            - type: object
              properties:
                hasNextPage:
                  type: boolean
                  description: '`true` if more results exist beyond this page'
                nextCursor:
                  $ref: '#/components/schemas/PaginationCursor'
                  description: Opaque cursor for retrieving the next page (only present when `hasNextPage` is `true`)
                limit:
                  type: integer
                  minimum: 1
                  maximum: 100
                  default: 20
                  description: Number of items per page requested
                totalCount:
                  type: integer
                  minimum: 0
                  description: |
                    Approximate total count of matching results (optional, may be omitted 
                    for performance reasons on large datasets)
              required:
                - hasNextPage
                - limit
      required:
        - data
        - meta

    ProblemDetail:
      type: object
      description: |
        **RFC 9457 Problem Details Object** (supersedes RFC 7807)

        Returned for all 4xx and 5xx errors. Provides machine-readable error information with human-readable descriptions.

        **Standard Members (RFC 9457 §3.1):**
        - `type`: URI reference identifying the problem type. Defaults to `"about:blank"` when omitted, in which case `title` SHOULD match the HTTP status reason phrase.
        - `title`: Short, human-readable summary. SHOULD NOT change between occurrences of the same type.
        - `status`: HTTP status code (advisory — MUST match the actual response status).
        - `detail`: Human-readable explanation specific to this occurrence.
        - `instance`: URI reference identifying the specific occurrence.

        **Extension Members:**
        - `correlationId`: Non-standard extension for request tracing and log correlation.
        - `errors`: Non-standard extension for field-level validation details (422 responses).
      properties:
        type:
          type: string
          format: uri-reference
          description: URI reference identifying the problem type (RFC 9457 §3.1.1). When absent or set to `"about:blank"`, title SHOULD match the HTTP status reason phrase.
          default: about:blank
          example: https://api.example.com/errors/invalid-parameter
        title:
          type: string
          description: Short, human-readable summary of the problem type (RFC 9457 §3.1.2). SHOULD be the same for all occurrences of the same `type`.
          example: Invalid Parameter
        status:
          type: integer
          description: HTTP status code (RFC 9457 §3.1.3). Advisory — MUST match the actual response status code. Included for convenience when consuming the body directly.
          minimum: 400
          maximum: 599
          example: 400
        detail:
          type: string
          description: Human-readable explanation specific to this occurrence (RFC 9457 §3.1.4). Intended for the developer, not end-user display.
          example: The 'email' field must be a valid email address.
        instance:
          type: string
          format: uri-reference
          description: URI reference identifying the specific occurrence (RFC 9457 §3.1.5). Typically the request path.
          example: /api/v1/users/me
        correlationId:
          $ref: '#/components/schemas/UUIDv7'
          description: 'Extension member: unique request identifier for support and log correlation. Maps to the `X-Request-ID` response header.'
        errors:
          type: array
          description: 'Extension member: field-level validation errors. Present only when `status` is 422 (Unprocessable Entity).'
          items:
            $ref: '#/components/schemas/ValidationError'
      required:
        - type
        - title
        - status
        - detail
        - instance

    ValidationError:
      type: object
      description: |
        Field-level validation error detail. Only present when `status` is 422 (Unprocessable Entity) 
        and the error involves specific input fields.
      properties:
        field:
          type: string
          description: JSON path to the invalid field (dot notation for nested objects)
          example: password
        message:
          type: string
          description: Specific validation failure message
          example: Password must be at least 8 characters and include uppercase, lowercase, digit, and special character.
        code:
          type: string
          description: Machine-readable error code for programmatic handling
          example: PASSWORD_COMPLEXITY
        rejectedValue:
          description: The value that failed validation (redacted for sensitive fields)
          example: short
      required:
        - field
        - message
        - code

    # ----- Users -----
    AccountDeletionRequest:
      type: object
      additionalProperties: false
      description: Account deletion request (GDPR FR-904)
      properties:
        confirmation:
          type: string
          enum:
            - DELETE_MY_ACCOUNT
          description: Must match exact string to confirm deletion
          example: DELETE_MY_ACCOUNT
        reason:
          type: string
          maxLength: 500
          description: Optional reason for leaving
        deleteAllData:
          type: boolean
          default: true
          description: Whether to delete all user data or retain anonymized analytics
          example: true
      required:
        - confirmation

    UserProfileUpdate:
      type: object
      additionalProperties: false
      description: Fields updatable by the user
      properties:
        displayName:
          type: string
          minLength: 1
          maxLength: 100
          description: User's display name
        email:
          type: string
          format: email
          description: Email address
        avatarObjectKey:
          type: string
          maxLength: 500
          description: |
            Object key of the avatar in storage (maps to auth.user_profiles.avatar_object_key).
            The server resolves this to a pre-signed URL when returning the profile;
            clients must not treat the key as a public URL.
          example: avatars/018f3a2c-9b5e-7d4a-a1c2-e3f4a5b6c7d8.jpg
        educationSegment:
          type: string
          enum:
            - TOEFL
            - IGCSE
            - HIGH_SCHOOL
            - COLLEGE
          description: |
            User education segment. API values are UPPER_CASE; the server normalises them 
            to the lowercase DB enum values (toefl, igcse, high_school, college) before persisting.
          x-db-enum: education_segment
          x-db-values:
            - toefl
            - igcse
            - high_school
            - college

    OnboardingStepUpdate:
      type: object
      additionalProperties: false
      description: Request to advance onboarding to a specific step
      properties:
        step:
          type: integer
          minimum: 0
          maximum: 5
          description: |
            Step to advance to. Step 0 is the initial unstarted state (DB default); 
            steps 1–5 represent onboarding progress stages.
          example: 3
      required:
        - step

    OnboardingRetriggerRequest:
      type: object
      additionalProperties: false
      description: Request to restart onboarding flow
      properties:
        reason:
          type: string
          enum:
            - USER_REQUESTED
            - APP_UPDATE
            - CONTENT_REFRESH
          description: Reason for retriggering onboarding
          example: USER_REQUESTED

    ConsentUpdate:
      type: object
      additionalProperties: false
      description: Request to update consent preferences
      properties:
        consents:
          type: array
          items:
            type: object
            properties:
              consentType:
                type: string
                enum:
                  - MARKETING
                  - ANALYTICS
                  - PERSONALIZATION
                  - THIRD_PARTY_SHARING
              consentVersion:
                type: string
                maxLength: 20
                description: |
                  Version string of the consent document the user is accepting 
                  (maps to auth.user_consents.consent_version, NOT NULL). 
                  Clients must supply the current version obtained from the consent 
                  policy document in effect.
                example: '1.0'
              isGranted:
                type: boolean
            required:
              - consentType
              - consentVersion
              - isGranted
      required:
        - consents

    DeviceRegistrationRequest:
      type: object
      additionalProperties: false
      description: Register a new device for the current user
      properties:
        deviceIdentifier:
          type: string
          maxLength: 255
          description: Device fingerprint (unique per device)
        deviceName:
          type: string
          maxLength: 100
          description: User-friendly device name
        platform:
          type: string
          enum:
            - iOS
            - Android
            - Web
          description: Device platform
        osVersion:
          type: string
          description: Operating system version
        appVersion:
          type: string
          description: Application version
      required:
        - deviceIdentifier

    DeviceUpdateRequest:
      type: object
      additionalProperties: false
      description: Update device details
      properties:
        deviceName:
          type: string
          maxLength: 100
          description: Updated device name
        isActive:
          type: boolean
          description: Mark device as active or inactive

    # ----- Dashboard -----
    DashboardData:
      type: object
      description: Aggregated dashboard data for the user's home screen
      properties:
        userStats:
          $ref: '#/components/schemas/UserStats'
        recentActivity:
          type: array
          items:
            $ref: '#/components/schemas/ActivityItem'
        insights:
          type: array
          items:
            $ref: '#/components/schemas/Insight'
        weeklyData:
          $ref: '#/components/schemas/WeeklyData'
        deadlines:
          type: array
          items:
            $ref: '#/components/schemas/Deadline'
        jumpBack:
          $ref: '#/components/schemas/JumpBackItem'

    UserStats:
      type: object
      description: User learning statistics
      properties:
        minutesToday:
          type: integer
          description: Minutes studied today
          example: 24
        lessonsToday:
          type: integer
          description: Lessons completed today
          example: 3
        xpEarned:
          type: integer
          description: Experience points earned
          example: 85
        streakDays:
          type: integer
          description: Current study streak in days
          example: 7
        streakTarget:
          type: integer
          description: Target streak for milestone
          example: 10

    ActivityItem:
      type: object
      description: A single activity feed item
      properties:
        id:
          $ref: '#/components/schemas/UUIDv7'
        type:
          type: string
          enum:
            - session
            - completion
            - enrollment
            - achievement
            - streak
            - milestone
          description: Type of activity
        title:
          type: string
          description: Activity title
        subtitle:
          type: string
          description: Optional subtitle
        detail:
          type: string
          description: Optional detail text
        time:
          type: string
          description: Time string relative to now (e.g., "2 hours ago")
        group:
          type: string
          description: Grouping key for UI

    Insight:
      type: object
      description: User insight or achievement
      properties:
        id:
          $ref: '#/components/schemas/UUIDv7'
        icon:
          type: string
          description: Icon identifier
        bgColor:
          type: string
          description: Background color code
        iconColor:
          type: string
          description: Icon color code
        title:
          type: string
          description: Insight title
        description:
          type: string
          description: Insight description

    WeeklyData:
      type: object
      description: Weekly study data for charts
      properties:
        barHeights:
          type: array
          items:
            type: number
          description: Bar heights for each day (0-1)
        dayTotals:
          type: array
          items:
            type: string
          description: Time totals for each day
        sessions:
          type: object
          additionalProperties:
            type: array
            items:
              $ref: '#/components/schemas/WeeklySession'
          description: Sessions grouped by day index

    WeeklySession:
      type: object
      description: A single study session
      properties:
        course:
          type: string
          description: Course name
        lesson:
          type: string
          description: Lesson name
        duration:
          type: string
          description: Duration string

    Deadline:
      type: object
      description: Upcoming deadline
      properties:
        title:
          type: string
          description: Deadline title
        date:
          type: string
          description: Deadline date string
        daysLeft:
          type: integer
          description: Days remaining
        color:
          type: string
          description: Color code

    JumpBackItem:
      type: object
      description: Course to jump back into
      properties:
        title:
          type: string
          description: Course title
        progress:
          type: integer
          description: Progress percentage
        imageSeed:
          type: string
          description: Image seed for UI

    # ----- Bookmarks -----
    BookmarkCreate:
      type: object
      additionalProperties: false
      description: Request to create a bookmark
      properties:
        itemType:
          type: string
          enum:
            - course
            - resource
          description: Type of item to bookmark
        itemId:
          $ref: '#/components/schemas/UUIDv7'
          description: ID of the course or resource to bookmark
      required:
        - itemType
        - itemId

    # ----- Purchases & recommendations -----
    PurchaseInitiateRequest:
      type: object
      additionalProperties: false
      description: Request to initiate a purchase
      properties:
        courseId:
          $ref: '#/components/schemas/UUIDv7'
        purchaseOptionId:
          $ref: '#/components/schemas/UUIDv7'
        platform:
          type: string
          enum:
            - IOS
            - ANDROID
          description: User's current platform
          example: IOS
      required:
        - courseId
        - purchaseOptionId
        - platform

    PurchaseOption:
      type: object
      description: A purchase option for a course
      properties:
        id:
          $ref: '#/components/schemas/UUIDv7'
        courseId:
          $ref: '#/components/schemas/UUIDv7'
        platform:
          type: string
          enum:
            - IOS
            - ANDROID
            - WEB
          description: Platform for this purchase option. API values are UPPER_CASE; maps to DB enum `purchase_platform` (ios, android, web).
          x-db-enum: purchase_platform
          x-db-values:
            - ios
            - android
            - web
        productId:
          type: string
        displayName:
          type: string
        description:
          type: string
        durationDays:
          type: integer
          minimum: 1
        price:
          $ref: '#/components/schemas/Money'
        isActive:
          type: boolean
      required:
        - id
        - courseId
        - platform
        - productId
        - displayName
        - durationDays
        - price

    RatingSubmit:
      type: object
      additionalProperties: false
      description: Submit a rating for a course
      properties:
        rating:
          type: integer
          minimum: 1
          maximum: 5
          description: Star rating (1-5)
          example: 5
      required:
        - rating

    ReviewSubmit:
      type: object
      additionalProperties: false
      description: Submit a review for a course
      properties:
        rating:
          type: integer
          minimum: 1
          maximum: 5
          example: 5
        title:
          type: string
          minLength: 1
          maxLength: 200
          example: Excellent content
        content:
          type: string
          minLength: 10
          maxLength: 2000
          example: This course covers all the topics needed for...
      required:
        - rating
        - title
        - content

    # ----- Webhooks -----
    TelebirrWebhookPayload:
      type: object
      additionalProperties: true
      description: |
        Telebirr C2B payment callback payload (FR-401, FR-404, NFR-TP01).
        Sole payment method — all platforms. Additional fields from Telebirr may be present
        depending on the merchant configuration and API version.
      properties:
        externalTransactionId:
          type: string
          description: Merchant-assigned transaction identifier for idempotency
          example: order-018f3a2c-9b5e-7d4a-a1c2
        merchantCode:
          type: string
          description: Telebirr-assigned merchant code for the application
          example: MERCH001
        transactionId:
          type: string
          description: Telebirr-assigned unique transaction identifier
          example: TXN20260430001
        amount:
          type: string
          pattern: ^\d+(\.\d{1,4})?$
          description: |
            Payment amount as a decimal string to preserve precision.
            Maps to `finance.purchase_transactions.amount` (DB: numeric(19,4)).
            String encoding avoids IEEE 754 float rounding errors.
          example: '299.9900'
        currency:
          type: string
          description: ISO 4217 currency code (typically ETB for Ethiopian Birr)
          example: ETB
        status:
          type: string
          description: Payment status as reported by Telebirr
          example: SUCCESS
        paymentTime:
          type: string
          format: date-time
          description: Timestamp when the payment was completed
          example: '2026-04-30T10:30:00Z'
        subscriberNumber:
          type: string
          description: The Telebirr subscriber (phone) number that made the payment
          example: '+251911123456'

    SmsDeliveryWebhookPayload:
      type: object
      additionalProperties: true
      description: |
        SMSEthiopia delivery status callback payload (FR-1005, NFR-TP01).
        Additional fields from SMSEthiopia may be present depending on the API version.

        **DB alignment note:** The v2.2 DBML removed all SMS/OTP tables (`sms_verifications` dropped, social-login only). 
        This webhook payload is consumed as an inbound external event and stored in `ops.webhook_events` 
        (provider=telebirr is the only modelled provider). If SMSEthiopia delivery callbacks are retained, 
        `ops.webhook_events.provider` must be extended with a `smsethiopia` enum value. 
        **Review required before go-live.**
      properties:
        messageId:
          type: string
          description: The unique identifier of the SMS message as assigned by SMSEthiopia
          example: msg-018f3a2c-9b5e-7d4a
        status:
          type: string
          enum:
            - DELIVERED
            - FAILED
            - EXPIRED
            - UNKNOWN
          description: Delivery status of the SMS message
          example: DELIVERED
        deliveredAt:
          type: string
          format: date-time
          description: Timestamp when the message was delivered (present only when status is DELIVERED)
          example: '2026-04-30T10:30:05Z'
        errorCode:
          type: string
          description: Provider-specific error code (present only when status is FAILED)
          example: INVALID_NUMBER
        errorMessage:
          type: string
          description: Human-readable error description (present only when status is FAILED)
          example: The destination number is not reachable

  # ======================================================================
  # PARAMETERS
  # ======================================================================
  parameters:
    cursor:
      name: cursor
      in: query
      required: false
      description: |
        Opaque cursor for retrieving the next page of results. 
        
        Obtained from the `meta.nextCursor` field of a previous paginated response.
        Omit or set to empty string to retrieve the first page.
        
        Cursors encode the sort key of the last item in the previous page and are 
        specific to the current sort order and filter combination.
      schema:
        type: string
      example: eyJ0aW1lc3RhbXAiOiIyMDI2LTA0LTMwVDEwOjAwOjAwWiIsImlkIjoiMDE4Zi4uLiJ9

    limit:
      name: limit
      in: query
      required: false
      description: |
        Maximum number of items to return per page.

        - Default: `20`
        - Minimum: `1`
        - Maximum: `100`

        Values outside this range will be clamped to the nearest valid value.
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
      example: 20

    deviceId:
