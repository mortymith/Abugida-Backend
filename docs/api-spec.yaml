  # =========================================================================
  # WEBHOOK ENDPOINTS
  # =========================================================================
  /webhooks/telebirr:
    post:
      tags: [Webhooks]
      summary: Telebirr C2B payment callback
      description: |
        Receives payment callback from Telebirr C2B service.
        Sole payment method — all platforms.
        Stores in `ops.webhook_events` (provider=telebirr) and updates
        `finance.purchase_transactions` + `finance.purchases` status.
        Idempotency enforced via `purchase_transactions.idempotency_key`.
      operationId: handleTelebirrWebhook
      security:
        - apiKeyHeader: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TelebirrWebhookPayload'
      responses:
        '200':
          description: Webhook processed
        '400':
          $ref: '#/components/responses/400'
        '401':
          $ref: '#/components/responses/401'
        '403':
          $ref: '#/components/responses/403'
        '409':
          description: Duplicate webhook (idempotency key already processed)
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
        '422':
          $ref: '#/components/responses/422'
        '429':
          $ref: '#/components/responses/429'
        '500':
          $ref: '#/components/responses/500'

  /webhooks/sms-delivery:
    post:
      tags: [Webhooks]
      summary: SMS delivery status callback
      description: |
        Receives delivery status from SMSEthiopia.
        Stores in `ops.webhook_events`.

        **DB Alignment Note:** `ops.webhook_events.provider` enum currently only has
        'telebirr'. This endpoint requires extending the `payment_provider` enum with
        'smsethiopia' or using a separate webhook_provider enum before go-live.
        The service layer should handle this gracefully until the DB migration is applied.
      operationId: handleSmsDeliveryWebhook
      security:
        - apiKeyHeader: []
      x-db-alignment: requires_enum_extension
      x-db-note: "ops.webhook_events.provider enum must include 'smsethiopia'"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SmsDeliveryWebhookPayload'
      responses:
        '200':
          description: Webhook processed
        '400':
          $ref: '#/components/responses/400'
        '401':
          $ref: '#/components/responses/401'
        '403':
          $ref: '#/components/responses/403'
        '409':
          $ref: '#/components/responses/409'
        '422':
          $ref: '#/components/responses/422'
        '429':
          $ref: '#/components/responses/429'
        '500':
          $ref: '#/components/responses/500'

  # =========================================================================
  # SYSTEM ENDPOINTS
  # =========================================================================
  /health:
    get:
      tags: [System]
      summary: Liveness probe
      description: |
        Returns 200 OK if the Abugida application process is running.
        No authentication required. No dependency checks performed.
      operationId: healthLiveness
      security: []
      responses:
        '200':
          description: Service is alive
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    enum: [ok]
                    example: ok
                  uptime:
                    type: number
                    description: Process uptime in seconds
                    example: 123456.78
                  version:
                    type: string
                    description: Deployed API version
                    example: 2.0.0
                  timestamp:
                    $ref: '#/components/schemas/Timestamp'
                required: [status, uptime, version, timestamp]
        '429':
          $ref: '#/components/responses/429'
        '500':
          $ref: '#/components/responses/500'

  /health/ready:
    get:
      tags: [System]
      summary: Readiness probe
      description: |
        Returns 200 OK only if all critical dependencies are available.
        Checks database connectivity, SMS provider, and payment gateway status.
      operationId: healthReadiness
      security: []
      responses:
        '200':
          description: All dependencies available
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    enum: [ok]
                  checks:
                    type: object
                    properties:
                      database:
                        type: string
                        enum: [ok, degraded, unavailable]
                      sms_provider:
                        type: string
                        enum: [ok, degraded, unavailable]
                      payment_gateway:
                        type: string
                        enum: [ok, degraded, unavailable]
                    required: [database, sms_provider, payment_gateway]
                  timestamp:
                    $ref: '#/components/schemas/Timestamp'
                required: [status, checks, timestamp]
        '429':
          $ref: '#/components/responses/429'
        '503':
          $ref: '#/components/responses/503'

# =============================================================================
# COMPONENTS
# =============================================================================
components:
  # ===========================================================================
  # SECURITY SCHEMES
  # ===========================================================================
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        JWT Bearer Token Authentication via Better Auth.
        Supported sign-in providers: **Google Sign-In** and **Apple ID**.
    apiKeyHeader:
      type: apiKey
      in: header
      name: X-API-Key
      description: |
        API Key Authentication for Webhooks.
        Validated against `ops.api_keys` table with `principal_type = 'integration'`.

  # ===========================================================================
  # SCHEMAS
  # ===========================================================================
  schemas:
    # ----- Shared primitives -----
    UUIDv7:
      type: string
      format: uuid
      description: |
        Universally Unique Identifier version 7 (time-ordered, monotonic).
        Maps to `public_id` columns in the database.
      pattern: ^[0-9a-f]{8}-[0-9a-f]{4}-7[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$
      example: 018f3a2c-9b5e-7d4a-a1c2-e3f4a5b6c7d8

    Timestamp:
      type: string
      format: date-time
      description: ISO 8601 timestamp with timezone (maps to timestamptz in PostgreSQL)
      example: '2026-04-30T14:30:00.000Z'

    CurrencyCode:
      type: string
      pattern: ^[A-Z]{3}$
      description: ISO 4217 three-letter currency code. Default ETB.
      minLength: 3
      maxLength: 3
      example: ETB

    Money:
      type: object
      description: Monetary value (maps to numeric(19,4) amount + char(3) currency in PostgreSQL)
      properties:
        amount:
          type: string
          pattern: ^\d{1,15}\.\d{1,4}$
          description: Exact decimal string (15 integer + 4 fractional = 19 digits)
          example: '299.9900'
        currency:
          $ref: '#/components/schemas/CurrencyCode'
      required: [amount, currency]

    PaginationCursor:
      type: string
      description: Opaque base64url-encoded cursor for pagination
      example: eyJ0aW1lc3RhbXAiOiIyMDI2LTA0LTMwVDEwOjAwOjAwWiIsImlkIjoiMDE4ZjNhMmMifQ

    # ----- Response envelopes -----
    ResponseMetadata:
      type: object
      properties:
        requestId:
          $ref: '#/components/schemas/UUIDv7'
        timestamp:
          $ref: '#/components/schemas/Timestamp'
      required: [requestId, timestamp]

    SingleResponse:
      description: Envelope for single resource responses
      properties:
        data:
          description: The response payload
        meta:
          $ref: '#/components/schemas/ResponseMetadata'
      required: [data, meta]

    CollectionResponse:
      description: Envelope for fixed-size collections (no pagination)
      properties:
        data:
          type: array
          items:
            type: object
        meta:
          allOf:
            - $ref: '#/components/schemas/ResponseMetadata'
            - type: object
              properties:
                count:
                  type: integer
                  minimum: 0
              required: [count]
      required: [data, meta]

    CursorPaginatedResponse:
      description: Envelope for cursor-paginated collections
      properties:
        data:
          type: array
          items:
            type: object
        meta:
          allOf:
            - $ref: '#/components/schemas/ResponseMetadata'
            - type: object
              properties:
                hasNextPage:
                  type: boolean
                nextCursor:
                  $ref: '#/components/schemas/PaginationCursor'
                limit:
                  type: integer
                  minimum: 1
                  maximum: 100
                  default: 20
                totalCount:
                  type: integer
                  minimum: 0
                  description: Approximate total (optional)
              required: [hasNextPage, limit]
      required: [data, meta]

    ProblemDetail:
      type: object
      description: RFC 9457 Problem Details
      properties:
        type:
          type: string
          format: uri-reference
          default: about:blank
        title:
          type: string
        status:
          type: integer
          minimum: 400
          maximum: 599
        detail:
          type: string
        instance:
          type: string
          format: uri-reference
        correlationId:
          $ref: '#/components/schemas/UUIDv7'
        errors:
          type: array
          items:
            $ref: '#/components/schemas/ValidationError'
      required: [type, title, status, detail, instance]

    ValidationError:
      type: object
      properties:
        field:
          type: string
        message:
          type: string
        code:
          type: string
        rejectedValue: {}
      required: [field, message, code]

    # ----- Domain: Exam Types -----
    ExamType:
      type: object
      description: Maps to catalog.exam_types
      properties:
        id:
          $ref: '#/components/schemas/UUIDv7'
        name:
          type: string
          maxLength: 100
        slug:
          type: string
          maxLength: 100
        description:
          type: string
        parentExamTypeId:
          $ref: '#/components/schemas/UUIDv7'
          description: Null for top-level exam types
        depth:
          type: integer
          minimum: 0
          description: '0=top-level, 1=child, etc.'
        sortOrder:
          type: integer
          minimum: 0
        isActive:
          type: boolean
        children:
          type: array
          items:
            $ref: '#/components/schemas/ExamTypeSummary'
          description: Immediate child exam types (when include_children=true)
      required: [id, name, slug, depth, isActive]

    ExamTypeSummary:
      type: object
      properties:
        id:
          $ref: '#/components/schemas/UUIDv7'
        name:
          type: string
        slug:
          type: string
        depth:
          type: integer
        sortOrder:
          type: integer
      required: [id, name, slug]

    # ----- Domain: Courses -----
    Course:
      type: object
      description: Maps to catalog.courses + catalog.course_stats
      properties:
        id:
          $ref: '#/components/schemas/UUIDv7'
        examTypeId:
          $ref: '#/components/schemas/UUIDv7'
        title:
          type: string
          maxLength: 300
        slug:
          type: string
          maxLength: 200
        description:
          type: string
        thumbnailUrl:
          type: string
          format: uri
          description: Resolved presigned URL from thumbnail_object_key
        price:
          $ref: '#/components/schemas/Money'
        isFree:
          type: boolean
        status:
          type: string
          enum: [DRAFT, PUBLISHED, ARCHIVED]
          description: Maps to DB course_status enum (draft, published, archived)
          x-db-enum: course_status
        version:
          type: integer
          minimum: 1
        sortOrder:
          type: integer
        stats:
          $ref: '#/components/schemas/CourseStats'
        createdAt:
          $ref: '#/components/schemas/Timestamp'
        updatedAt:
          $ref: '#/components/schemas/Timestamp'
      required: [id, examTypeId, title, slug, status, isFree]

    CourseStats:
      type: object
      description: Maps to catalog.course_stats
      properties:
        totalEnrollments:
          type: integer
        averageRating:
          type: number
          format: float
          minimum: 1.0
          maximum: 5.0
          nullable: true
        ratingCount:
          type: integer
        popularityScore:
          type: number
      required: [totalEnrollments, ratingCount]

    CourseCurriculum:
      type: object
      description: Full course hierarchy (modules → lessons)
      properties:
        courseId:
          $ref: '#/components/schemas/UUIDv7'
        courseTitle:
          type: string
        modules:
          type: array
          items:
            $ref: '#/components/schemas/ModuleWithLessons'
      required: [courseId, modules]

    ModuleWithLessons:
      type: object
      description: Maps to catalog.modules with nested lessons
      properties:
        id:
          $ref: '#/components/schemas/UUIDv7'
        title:
          type: string
          maxLength: 300
        description:
          type: string
        sortOrder:
          type: integer
        estimatedDurationMinutes:
          type: integer
          nullable: true
        isPreviewAvailable:
          type: boolean
        lessons:
          type: array
          items:
            $ref: '#/components/schemas/LessonSummary'
      required: [id, title, sortOrder]

    LessonSummary:
      type: object
      properties:
        id:
          $ref: '#/components/schemas/UUIDv7'
        title:
          type: string
          maxLength: 300
        contentType:
          type: string
          enum: [PDF, VIDEO, QUIZ, EXERCISE, LINK]
          description: Maps to DB content_type enum (pdf, video, quiz, exercise, link)
          x-db-enum: content_type
        durationSeconds:
          type: integer
          nullable: true
        isDownloadable:
          type: boolean
      required: [id, title, contentType]

    Lesson:
      type: object
      description: Maps to catalog.lessons (full detail)
      properties:
        id:
          $ref: '#/components/schemas/UUIDv7'
        moduleId:
          $ref: '#/components/schemas/UUIDv7'
        courseId:
          $ref: '#/components/schemas/UUIDv7'
        title:
          type: string
          maxLength: 300
        description:
          type: string
        contentType:
          type: string
          enum: [PDF, VIDEO, QUIZ, EXERCISE, LINK]
          description: Maps to DB content_type enum
          x-db-enum: content_type
        fileSizeBytes:
          type: integer
          format: int64
          nullable: true
          description: Maps to DB bigint column
        mimeType:
          type: string
          maxLength: 100
        durationSeconds:
          type: integer
          nullable: true
        pageCount:
          type: integer
          nullable: true
        isDownloadable:
          type: boolean
        downloadSizeLimitBytes:
          type: integer
          format: int64
          description: Max download size (default 500MB = 524288000 bytes)
        rowVersion:
          type: integer
          description: Optimistic lock version (used for ETag)
        createdAt:
          $ref: '#/components/schemas/Timestamp'
        updatedAt:
          $ref: '#/components/schemas/Timestamp'
      required: [id, moduleId, courseId, title, contentType, isDownloadable]

    # ----- Domain: Bundles -----
    CourseBundle:
      type: object
      description: Maps to catalog.course_bundles
      properties:
        id:
          $ref: '#/components/schemas/UUIDv7'
        examTypeId:
          $ref: '#/components/schemas/UUIDv7'
        title:
          type: string
          maxLength: 300
        slug:
          type: string
          maxLength: 200
        description:
          type: string
        thumbnailUrl:
          type: string
          format: uri
        price:
          $ref: '#/components/schemas/Money'
          description: Discounted bundle price
        originalPrice:
          $ref: '#/components/schemas/Money'
          description: Sum of individual course prices
        discountPercentage:
          type: number
          format: float
          minimum: 0
          maximum: 100
          description: 'Calculated: ((original - bundle) / original) * 100'
        status:
          type: string
          enum: [DRAFT, PUBLISHED, ARCHIVED]
          description: Maps to DB bundle_status enum
          x-db-enum: bundle_status
        courseCount:
          type: integer
          description: Number of included courses (computed from bundle_courses WHERE is_included=true)
        publishedAt:
          $ref: '#/components/schemas/Timestamp'
          nullable: true
        createdAt:
          $ref: '#/components/schemas/Timestamp'
      required: [id, examTypeId, title, slug, price, originalPrice, discountPercentage, status]

    BundleCourseItem:
      type: object
      description: A course within a bundle (from bundle_courses junction)
      properties:
        courseId:
          $ref: '#/components/schemas/UUIDv7'
        title:
          type: string
        slug:
          type: string
        thumbnailUrl:
          type: string
        individualPrice:
          $ref: '#/components/schemas/Money'
        sortOrder:
          type: integer
      required: [courseId, title, sortOrder]

    # ----- Domain: Purchases -----
    PurchaseOption:
      type: object
      description: |
        Maps to finance.purchase_options. Supports both course and bundle pricing.
        XOR constraint: exactly one of courseId or bundleId is present.
      properties:
        id:
          $ref: '#/components/schemas/UUIDv7'
        courseId:
          $ref: '#/components/schemas/UUIDv7'
          description: Present for course purchase options (null for bundles)
          nullable: true
        bundleId:
          $ref: '#/components/schemas/UUIDv7'
          description: Present for bundle purchase options (null for courses)
          nullable: true
        platform:
          type: string
          enum: [IOS, ANDROID, WEB]
          description: Maps to DB platform enum (ios, android, web)
          x-db-enum: platform
        productId:
          type: string
          maxLength: 255
        displayName:
          type: string
          maxLength: 150
        description:
          type: string
        durationDays:
          type: integer
          minimum: 1
        price:
          $ref: '#/components/schemas/Money'
        isActive:
          type: boolean
      required: [id, platform, productId, displayName, durationDays, price]

    PurchaseInitiateRequest:
      type: object
      additionalProperties: false
      description: |
        Request to initiate a purchase. XOR constraint: exactly one of
        courseId or bundleId must be provided (matches DB CHECK constraint).
        The payment_gateway_id is resolved server-side (not provided by client).
      properties:
        courseId:
          $ref: '#/components/schemas/UUIDv7'
          description: Course to purchase (mutually exclusive with bundleId)
        bundleId:
          $ref: '#/components/schemas/UUIDv7'
          description: Bundle to purchase (mutually exclusive with courseId)
        purchaseOptionId:
          $ref: '#/components/schemas/UUIDv7'
          description: Selected purchase option
        platform:
          type: string
          enum: [IOS, ANDROID, WEB]
          description: User's current platform
          x-db-enum: platform
          example: IOS
      required: [purchaseOptionId, platform]

    Purchase:
      type: object
      description: Maps to finance.purchases
      properties:
        id:
          $ref: '#/components/schemas/UUIDv7'
        courseId:
          $ref: '#/components/schemas/UUIDv7'
          nullable: true
          description: Present for course purchases
        bundleId:
          $ref: '#/components/schemas/UUIDv7'
          nullable: true
          description: Present for bundle purchases
        purchaseOptionId:
          $ref: '#/components/schemas/UUIDv7'
        status:
          type: string
          enum: [INITIATED, PAYMENT_PENDING, COMPLETED, FAILED]
          description: Maps to DB purchase_status enum
          x-db-enum: purchase_status
        amount:
          $ref: '#/components/schemas/Money'
        completedAt:
          $ref: '#/components/schemas/Timestamp'
          nullable: true
        createdAt:
          $ref: '#/components/schemas/Timestamp'
        enrollments:
          type: array
          items:
            $ref: '#/components/schemas/UUIDv7'
          description: Enrollment IDs created from this purchase (for bundles, one per course)
      required: [id, purchaseOptionId, status, amount, createdAt]

    # ----- Domain: Enrollments -----
    Enrollment:
      type: object
      description: Maps to learning.enrollments
      properties:
        id:
          $ref: '#/components/schemas/UUIDv7'
        courseId:
          $ref: '#/components/schemas/UUIDv7'
        purchaseId:
          $ref: '#/components/schemas/UUIDv7'
          nullable: true
        bundleId:
          $ref: '#/components/schemas/UUIDv7'
          nullable: true
          description: Set when enrollment was created from a bundle purchase
        enrollmentSource:
          type: string
          enum: [PURCHASE, BUNDLE_PURCHASE, FREE_ACCESS, ADMIN_GRANT, PREVIEW]
          description: Maps to DB enrollment_source enum
          x-db-enum: enrollment_source
        progressPercentage:
          type: number
          format: float
          minimum: 0
          maximum: 100
        isCompleted:
          type: boolean
        completedAt:
          $ref: '#/components/schemas/Timestamp'
          nullable: true
        lastAccessedAt:
          $ref: '#/components/schemas/Timestamp'
          nullable: true
        createdAt:
          $ref: '#/components/schemas/Timestamp'
      required: [id, courseId, enrollmentSource, progressPercentage, isCompleted]

    ProgressStats:
      type: object
      description: Aggregated progress statistics
      properties:
        totalEnrollments:
          type: integer
        activeEnrollments:
          type: integer
        completedEnrollments:
          type: integer
        totalLessonsCompleted:
          type: integer
        totalStudyTimeSeconds:
          type: integer
      required: [totalEnrollments, activeEnrollments, completedEnrollments]

    # ----- Domain: Lesson Completions -----
    LessonCompletion:
      type: object
      description: Maps to learning.lesson_completions
      properties:
        id:
          $ref: '#/components/schemas/UUIDv7'
        lessonId:
          $ref: '#/components/schemas/UUIDv7'
        enrollmentId:
          $ref: '#/components/schemas/UUIDv7'
        isCompleted:
          type: boolean
        completedAt:
          $ref: '#/components/schemas/Timestamp'
          nullable: true
        timeSpentSeconds:
          type: integer
          nullable: true
        createdAt:
          $ref: '#/components/schemas/Timestamp'
        updatedAt:
          $ref: '#/components/schemas/Timestamp'
      required: [id, lessonId, enrollmentId, isCompleted]

    LessonCompletionUpdate:
      type: object
      additionalProperties: false
      properties:
        isCompleted:
          type: boolean
          description: Set true to mark complete, false to mark incomplete
        timeSpentSeconds:
          type: integer
          minimum: 0
          description: Cumulative time spent on this lesson
      required: [isCompleted]

    # ----- Domain: Quiz -----
    QuizQuestionSet:
      type: object
      description: Quiz questions for a lesson (without correct answers)
      properties:
        lessonId:
          $ref: '#/components/schemas/UUIDv7'
        totalQuestions:
          type: integer
        questions:
          type: array
          items:
            $ref: '#/components/schemas/QuizQuestion'
      required: [lessonId, totalQuestions, questions]

    QuizQuestion:
      type: object
      description: Maps to learning.quiz_questions (student view — no correct_answer)
      properties:
        id:
          $ref: '#/components/schemas/UUIDv7'
        questionIndex:
          type: integer
          minimum: 0
        questionText:
          type: string
      required: [id, questionIndex, questionText]

    QuizSubmitRequest:
      type: object
      additionalProperties: false
      description: Submit answers for a quiz attempt
      properties:
        answers:
          type: array
          items:
            type: object
            properties:
              questionId:
                $ref: '#/components/schemas/UUIDv7'
              answer:
                type: string
                maxLength: 10000
                description: Student's answer (max 10,000 chars)
            required: [questionId, answer]
        startedAt:
          $ref: '#/components/schemas/Timestamp'
          description: When the student started the quiz
      required: [answers, startedAt]

    QuizAttemptResult:
      type: object
      description: Result of a quiz submission
      properties:
        attemptId:
          $ref: '#/components/schemas/UUIDv7'
        attemptNumber:
          type: integer
          minimum: 1
        totalQuestions:
          type: integer
        correctAnswers:
          type: integer
        scorePercentage:
          type: number
          format: float
          minimum: 0
          maximum: 100
        isPassed:
          type: boolean
        durationSeconds:
          type: integer
          nullable: true
        answers:
          type: array
          items:
            type: object
            properties:
              questionId:
                $ref: '#/components/schemas/UUIDv7'
              isCorrect:
                type: boolean
              explanation:
                type: string
                description: Shown after submission
      required:
        [attemptId, attemptNumber, totalQuestions, correctAnswers, scorePercentage, isPassed]

    QuizAttemptDetail:
      type: object
      description: Full quiz attempt with answers
      properties:
        id:
          $ref: '#/components/schemas/UUIDv7'
        lessonId:
          $ref: '#/components/schemas/UUIDv7'
        attemptNumber:
          type: integer
        totalQuestions:
          type: integer
        correctAnswers:
          type: integer
        scorePercentage:
          type: number
        isPassed:
          type: boolean
        durationSeconds:
          type: integer
          nullable: true
        startedAt:
          $ref: '#/components/schemas/Timestamp'
        completedAt:
          $ref: '#/components/schemas/Timestamp'
          nullable: true
        answers:
          type: array
          items:
            type: object
            properties:
              questionId:
                $ref: '#/components/schemas/UUIDv7'
              questionText:
                type: string
              studentAnswer:
                type: string
              isCorrect:
                type: boolean
              correctAnswer:
                type: string
                description: Revealed after attempt completion
              explanation:
                type: string
      required:
        [id, lessonId, attemptNumber, totalQuestions, correctAnswers, scorePercentage, isPassed]

    # ----- Domain: Users -----
    UserProfile:
      type: object
      description: Maps to auth.users + auth.user_profiles
      properties:
        id:
          $ref: '#/components/schemas/UUIDv7'
          description: public_id from auth.users
        displayName:
          type: string
          maxLength: 100
        email:
          type: string
          format: email
          description: Decrypted email (from email_encrypted)
        avatarUrl:
          type: string
          format: uri
          description: Resolved presigned URL from avatar_object_key
        educationSegment:
          type: string
          enum: [PRIMARY, SECONDARY, TERTIARY, GENERAL]
          description: |
            User's education segment. Maps to DB education_segment enum.
            Service layer maps: PRIMARY→toefl, SECONDARY→igcse, TERTIARY→high_school, GENERAL→college.
          x-db-enum: education_segment
          x-db-values: [toefl, igcse, high_school, college]
        notificationPreferences:
          type: object
          description: Maps to user_profiles.notification_preferences (jsonb)
        languagePreference:
          type: string
          maxLength: 10
          default: en
        timezone:
          type: string
          maxLength: 50
          default: Africa/Addis_Ababa
        examPreferences:
          type: array
          items:
            type: object
          description: Maps to user_profiles.exam_preferences (jsonb)
        isOnboardingCompleted:
          type: boolean
        onboardingStep:
          type: integer
          minimum: 0
          maximum: 5
        accountStatus:
          type: string
          enum: [PENDING_VERIFICATION, ACTIVE, LOCKED, SUSPENDED, DELETED]
          description: Maps to DB account_status enum
          x-db-enum: account_status
        createdAt:
          $ref: '#/components/schemas/Timestamp'
      required: [id, accountStatus]

    UserProfileUpdate:
      type: object
      additionalProperties: false
      description: Fields updatable by the user
      properties:
        displayName:
          type: string
          minLength: 1
          maxLength: 100
        email:
          type: string
          format: email
          description: Server encrypts (AES-256-GCM) and hashes (SHA-256) before storing
        avatarObjectKey:
          type: string
          maxLength: 500
        educationSegment:
          type: string
          enum: [PRIMARY, SECONDARY, TERTIARY, GENERAL]
          description: Maps to DB education_segment enum
          x-db-enum: education_segment
          x-db-values: [toefl, igcse, high_school, college]
        languagePreference:
          type: string
          maxLength: 10
        timezone:
          type: string
          maxLength: 50
        notificationPreferences:
          type: object
          description: JSON object for notification settings
        examPreferences:
          type: array
          items:
            type: object
          description: Exam preference settings

    AccountDeletionRequest:
      type: object
      additionalProperties: false
      properties:
        confirmation:
          type: string
          enum: [DELETE_MY_ACCOUNT]
        reason:
          type: string
          maxLength: 500
        deleteAllData:
          type: boolean
          default: true
      required: [confirmation]

    OnboardingState:
      type: object
      properties:
        isCompleted:
          type: boolean
        currentStep:
          type: integer
          minimum: 0
          maximum: 5
      required: [isCompleted, currentStep]

    OnboardingStepUpdate:
      type: object
      additionalProperties: false
      properties:
        step:
          type: integer
          minimum: 0
          maximum: 5
      required: [step]

    OnboardingRetriggerRequest:
      type: object
      additionalProperties: false
      properties:
        reason:
          type: string
          enum: [USER_REQUESTED, APP_UPDATE, CONTENT_REFRESH]

    ConsentRecord:
      type: object
      description: Maps to auth.user_consents
      properties:
        consentType:
          type: string
          enum: [ESSENTIAL, ANALYTICS, PERSONALIZATION, MARKETING, THIRD_PARTY_SHARING]
          description: Maps to DB consent_type enum
          x-db-enum: consent_type
        consentVersion:
          type: string
          maxLength: 20
        isGranted:
          type: boolean
        consentedAt:
          $ref: '#/components/schemas/Timestamp'
      required: [consentType, consentVersion, isGranted, consentedAt]

    ConsentUpdate:
      type: object
      additionalProperties: false
      description: |
        Update consent preferences. Note: 'essential' consent is always granted
        and cannot be modified. Only modifiable types are listed here.
      properties:
        consents:
          type: array
          items:
            type: object
            properties:
              consentType:
                type: string
                enum: [MARKETING, ANALYTICS, PERSONALIZATION, THIRD_PARTY_SHARING]
                description: Maps to DB consent_type enum (excludes essential)
                x-db-enum: consent_type
              consentVersion:
                type: string
                maxLength: 20
              isGranted:
                type: boolean
            required: [consentType, consentVersion, isGranted]
      required: [consents]

    Device:
      type: object
      description: Maps to auth.devices
      properties:
        id:
          $ref: '#/components/schemas/UUIDv7'
        deviceIdentifier:
          type: string
          maxLength: 255
        deviceName:
          type: string
          maxLength: 100
        platform:
          type: string
          enum: [IOS, ANDROID, WEB]
          description: Maps to DB platform enum (ios, android, web)
          x-db-enum: platform
        osVersion:
          type: string
          maxLength: 50
        appVersion:
          type: string
          maxLength: 20
        lastActiveAt:
          $ref: '#/components/schemas/Timestamp'
        isActive:
          type: boolean
      required: [id, deviceIdentifier, isActive]

    DeviceRegistrationRequest:
      type: object
      additionalProperties: false
      properties:
        deviceIdentifier:
          type: string
          maxLength: 255
        deviceName:
          type: string
          maxLength: 100
        platform:
          type: string
          enum: [IOS, ANDROID, WEB]
          description: Maps to DB platform enum
          x-db-enum: platform
        osVersion:
          type: string
          maxLength: 50
        appVersion:
          type: string
          maxLength: 20
      required: [deviceIdentifier]

    DeviceUpdateRequest:
      type: object
      additionalProperties: false
      properties:
        deviceName:
          type: string
          maxLength: 100
        isActive:
          type: boolean

    # ----- Domain: Dashboard -----
    DashboardData:
      type: object
      description: Aggregated dashboard (computed service-side)
      properties:
        userStats:
          $ref: '#/components/schemas/UserStats'
        recentActivity:
          type: array
          items:
            $ref: '#/components/schemas/ActivityItem'
        insights:
          type: array
          items:
            $ref: '#/components/schemas/Insight'
        weeklyData:
          $ref: '#/components/schemas/WeeklyData'
        deadlines:
          type: array
          items:
            $ref: '#/components/schemas/Deadline'
        jumpBack:
          $ref: '#/components/schemas/JumpBackItem'

    UserStats:
      type: object
      properties:
        minutesToday:
          type: integer
        lessonsToday:
          type: integer
        xpEarned:
          type: integer
        streakDays:
          type: integer
        streakTarget:
          type: integer

    ActivityItem:
      type: object
      properties:
        id:
          $ref: '#/components/schemas/UUIDv7'
        type:
          type: string
          enum: [SESSION, COMPLETION, ENROLLMENT, ACHIEVEMENT, STREAK, MILESTONE]
        title:
          type: string
        subtitle:
          type: string
        detail:
          type: string
        time:
          type: string
        group:
          type: string

    Insight:
      type: object
      properties:
        id:
          $ref: '#/components/schemas/UUIDv7'
        icon:
          type: string
        bgColor:
          type: string
        iconColor:
          type: string
        title:
          type: string
        description:
          type: string

    WeeklyData:
      type: object
      properties:
        barHeights:
          type: array
          items:
            type: number
        dayTotals:
          type: array
          items:
            type: string
        sessions:
          type: object
          additionalProperties:
            type: array
            items:
              $ref: '#/components/schemas/WeeklySession'

    WeeklySession:
      type: object
      properties:
        course:
          type: string
        lesson:
          type: string
        duration:
          type: string

    Deadline:
      type: object
      properties:
        title:
          type: string
        date:
          type: string
        daysLeft:
          type: integer
        color:
          type: string

    JumpBackItem:
      type: object
      properties:
        title:
          type: string
        progress:
          type: integer
        imageSeed:
          type: string

    # ----- Domain: Bookmarks -----
    BookmarkCreate:
      type: object
      additionalProperties: false
      properties:
        itemType:
          type: string
          enum: [COURSE, RESOURCE]
        itemId:
          $ref: '#/components/schemas/UUIDv7'
      required: [itemType, itemId]

    # ----- Domain: Ratings & Reviews -----
    CourseRatingSummary:
      type: object
      description: |
        Rating summary for a course. The `distribution` field is computed at
        query time by aggregating `learning.course_reviews` grouped by rating.
      properties:
        courseId:
          $ref: '#/components/schemas/UUIDv7'
        averageRating:
          type: number
          format: float
          nullable: true
          minimum: 1.0
          maximum: 5.0
        ratingCount:
          type: integer
        distribution:
          type: object
          description: Count per star (1-5), computed from course_reviews table
          properties:
            '1':
              type: integer
            '2':
              type: integer
            '3':
              type: integer
            '4':
              type: integer
            '5':
              type: integer
      required: [courseId, ratingCount]

    RatingSubmit:
      type: object
      additionalProperties: false
      properties:
        rating:
          type: integer
          minimum: 1
          maximum: 5
      required: [rating]

    ReviewSubmit:
      type: object
      additionalProperties: false
      properties:
        rating:
          type: integer
          minimum: 1
          maximum: 5
        title:
          type: string
          minLength: 1
          maxLength: 200
        content:
          type: string
          minLength: 10
          maxLength: 2000
      required: [rating, title, content]

    # ----- Domain: Webhooks -----
    TelebirrWebhookPayload:
      type: object
      additionalProperties: true
      description: Telebirr C2B payment callback
      properties:
        externalTransactionId:
          type: string
          description: Maps to purchase_transactions.external_transaction_id
        merchantCode:
          type: string
          description: Stored in validation_response jsonb
        transactionId:
          type: string
          description: Telebirr transaction ID (stored in validation_response)
        amount:
          type: string
          pattern: ^\d+(\.\d{1,4})?$
          description: Maps to purchase_transactions.amount (numeric 19,4)
        currency:
          type: string
          description: Maps to purchase_transactions.currency (char 3)
        status:
          type: string
          description: 'Telebirr status. Mapped: SUCCESS→succeeded, FAILED→failed'
        paymentTime:
          type: string
          format: date-time
          description: Maps to purchases.completed_at
        subscriberNumber:
          type: string
          description: PII — stored encrypted in validation_response

    SmsDeliveryWebhookPayload:
      type: object
      additionalProperties: true
      description: SMSEthiopia delivery callback
      properties:
        messageId:
          type: string
        status:
          type: string
          enum: [DELIVERED, FAILED, EXPIRED, UNKNOWN]
        deliveredAt:
          type: string
          format: date-time
        errorCode:
          type: string
        errorMessage:
          type: string

  # ===========================================================================
  # RESPONSES
  # ===========================================================================
  responses:
    '400':
      description: Bad Request
      headers:
        X-Request-ID:
          $ref: '#/components/headers/X-Request-ID'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetail'
    '401':
      description: Unauthorized
      headers:
        X-Request-ID:
          $ref: '#/components/headers/X-Request-ID'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetail'
    '403':
      description: Forbidden
      headers:
        X-Request-ID:
          $ref: '#/components/headers/X-Request-ID'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetail'
    '404':
      description: Not Found
      headers:
        X-Request-ID:
          $ref: '#/components/headers/X-Request-ID'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetail'
    '409':
      description: Conflict
      headers:
        X-Request-ID:
          $ref: '#/components/headers/X-Request-ID'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetail'
    '410':
      description: Gone
      headers:
        X-Request-ID:
          $ref: '#/components/headers/X-Request-ID'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetail'
    '422':
      description: Unprocessable Entity
      headers:
        X-Request-ID:
          $ref: '#/components/headers/X-Request-ID'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetail'
    '429':
      description: Too Many Requests
      headers:
        X-Request-ID:
          $ref: '#/components/headers/X-Request-ID'
        X-RateLimit-Limit:
          $ref: '#/components/headers/X-RateLimit-Limit'
        X-RateLimit-Remaining:
          $ref: '#/components/headers/X-RateLimit-Remaining'
        X-RateLimit-Reset:
          $ref: '#/components/headers/X-RateLimit-Reset'
        Retry-After:
          description: Seconds to wait
          schema:
            type: integer
            minimum: 1
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetail'
    '500':
      description: Internal Server Error
      headers:
        X-Request-ID:
          $ref: '#/components/headers/X-Request-ID'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetail'
    '503':
      description: Service Unavailable
      headers:
        X-Request-ID:
          $ref: '#/components/headers/X-Request-ID'
        Retry-After:
          description: Seconds to wait
          schema:
            type: integer
            minimum: 1
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetail'

  # ===========================================================================
  # HEADERS
  # ===========================================================================
  headers:
    X-Request-ID:
      description: Unique request identifier
      schema:
        type: string
        format: uuid
    X-RateLimit-Remaining:
      description: Requests remaining in window
      schema:
        type: integer
        minimum: 0
    X-RateLimit-Limit:
      description: Max requests per window
      schema:
        type: integer
        minimum: 1
    X-RateLimit-Reset:
      description: Unix timestamp when window resets
      schema:
        type: integer
        minimum: 0
