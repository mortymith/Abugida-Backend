  # ----------------------------------------------------------------------
  # Course-Centric Search
  # ----------------------------------------------------------------------
  /search/courses:
    get:
      tags:
        - Resources
      summary: Search for courses
      description: |
        **Course-Centric Search:** This endpoint is specifically optimized for finding 
        courses across the platform. Unlike the generic resource search, this search 
        focuses on course metadata including titles, descriptions, providers, and 
        educational context.
        
        **Search Strategy:**
        - Primary: Full-text search on course title, description, and provider
        - Secondary: Filter by education level, exam type, and tags
        - Tertiary: Sort by relevance, rating, popularity, or price
        
        **Best Practices:**
        - Use `q` for keyword search (min 2 characters for performance)
        - Combine with filters to narrow results effectively
        - Use `fuzzy=true` for approximate matching (typo tolerance)
        - Results are paginated using cursor-based pagination
        
        **Search Example:**
        ```
        /search/courses?q=chemistry&exam-type=igcse&sort=rating&limit=20
        ```
        
        **Performance:** Results are cached for 60 seconds. Full-text search uses
        PostgreSQL GIN indexes for optimal performance.
      operationId: searchCourses
      parameters:
        - name: q
          in: query
          required: false
          description: |
            Keyword search query. Supports full-text search on course title, 
            description, and provider. Minimum 2 characters for performance.
            If omitted, returns paginated courses with applied filters.
          schema:
            type: string
            minLength: 2
            maxLength: 200
          example: atomic structure
        
        - name: fuzzy
          in: query
          required: false
          description: |
            Enable fuzzy matching for approximate searches. Uses PostgreSQL trigram
            similarity for typo tolerance and partial matching.
          schema:
            type: boolean
            default: false
          example: true
        
        - name: education_level
          in: query
          required: false
          description: Filter by education level ID
          schema:
            $ref: '#/components/schemas/UUIDv7'
          example: 018f3a2c-9b5e-7d4a-a1c2-e3f4a5b6c7d8
        
        - name: exam_type
          in: query
          required: false
          description: Filter by exam type ID
          schema:
            $ref: '#/components/schemas/UUIDv7'
          example: 018f3a2c-9b5e-7d4a-a1c2-e3f4a5b6c7d9
        
        - name: tags
          in: query
          required: false
          description: Filter by tags (comma-separated)
          schema:
            type: array
            items:
              $ref: '#/components/schemas/UUIDv7'
          example: 018f3a2c-9b5e-7d4a-a1c2-e3f4a5b6c7da
        
        - name: sort
          in: query
          required: false
          description: |
            Sort order for search results.
            - `relevance` - Most relevant to search query (default)
            - `rating` - Highest rated
            - `popularity` - Most popular (enrollments + activity)
            - `newest` - Most recently added
            - `price_low` - Cheapest first
            - `price_high` - Most expensive first
          schema:
            type: string
            enum:
              - relevance
              - rating
              - popularity
              - newest
              - price_low
              - price_high
            default: relevance
        
        - name: min_price
          in: query
          required: false
          description: Minimum price in ETB
          schema:
            type: number
            minimum: 0
          example: 100
        
        - name: max_price
          in: query
          required: false
          description: Maximum price in ETB
          schema:
            type: number
            minimum: 0
          example: 500
        
        - name: free_only
          in: query
          required: false
          description: Only return free courses
          schema:
            type: boolean
            default: false
        
        - $ref: '#/components/parameters/cursor'
        - $ref: '#/components/parameters/limit'
      
      responses:
        '200':
          description: Course search results retrieved
          headers:
            Cache-Control:
              schema:
                type: string
                example: public, max-age=60
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CursorPaginatedResponse'
        '400':
          $ref: '#/components/responses/400'
        '401':
          $ref: '#/components/responses/401'
        '403':
          $ref: '#/components/responses/403'
        '429':
          $ref: '#/components/responses/429'
        '500':
          $ref: '#/components/responses/500'

  /search/suggestions:
    get:
      tags:
        - Resources
      summary: Get search suggestions
      description: |
        Provides autocomplete suggestions for course search queries. 
        Returns trending searches, popular topics, and query suggestions
        based on platform-wide search activity.
        
        **Use Cases:**
        - Search bar autocomplete
        - Trending topics display
        - Popular course suggestions
        
        **Implementation:**
        - Trending: Based on recent search volume (last 7 days)
        - Popular topics: Most frequently searched terms
        - Real-time: Minimal latency for typing experience
      operationId: getSearchSuggestions
      parameters:
        - name: q
          in: query
          required: false
          description: Prefix for autocomplete suggestions
          schema:
            type: string
            minLength: 1
            maxLength: 50
          example: chem
        
        - name: limit
          in: query
          required: false
          description: Maximum number of suggestions to return
          schema:
            type: integer
            minimum: 1
            maximum: 20
            default: 10
      responses:
        '200':
          description: Search suggestions retrieved
