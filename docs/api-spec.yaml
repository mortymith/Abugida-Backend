  # =========================================================================
  /courses/{courseId}/purchase-options:
    get:
      tags: [Purchases]
      summary: Get purchase options for a course
      description: |
        Returns purchase options for a specific course. Telebirr is the sole payment method.
        Maps to `finance.purchase_options WHERE course_id = :id AND is_active = true`.
        Uses index `idx_purchase_options_course`.
      operationId: getCoursePurchaseOptions
      parameters:
        - name: courseId
          in: path
          required: true
          description: UUID v7 identifier of the course
          schema:
            $ref: '#/components/schemas/UUIDv7'
          example: 018f3a2c-9b5e-7d4a-a1c2-e3f4a5b6c7d8
      responses:
        '200':
          description: Purchase options retrieved
          headers:
            X-Platform-Payment-Methods:
              description: Available payment methods
              schema:
                type: array
                items:
                  type: string
                  enum: [telebirr]
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/CollectionResponse'
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/PurchaseOption'
        '400':
          $ref: '#/components/responses/400'
        '401':
          $ref: '#/components/responses/401'
        '403':
          $ref: '#/components/responses/403'
        '404':
          $ref: '#/components/responses/404'
        '429':
          $ref: '#/components/responses/429'
        '500':
          $ref: '#/components/responses/500'

  /purchases:
    get:
      tags: [Purchases]
      summary: List user purchases
      description: |
        Returns all purchases (courses and bundles) for the authenticated user.
        Maps to `finance.purchases WHERE student_id = :userId`.
        Uses index `idx_purchases_student_time`.
      operationId: listPurchases
      security:
        - bearerAuth: []
      parameters:
        - name: cursor
          in: query
          required: false
          schema:
            type: string
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
        - name: type
          in: query
          required: false
          description: Filter by purchase type (course or bundle)
          schema:
            type: string
            enum: [COURSE, BUNDLE]
      responses:
        '200':
          description: Purchases retrieved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CursorPaginatedResponse'
        '400':
          $ref: '#/components/responses/400'
        '401':
          $ref: '#/components/responses/401'
        '403':
          $ref: '#/components/responses/403'
        '429':
          $ref: '#/components/responses/429'
        '500':
          $ref: '#/components/responses/500'
    post:
      tags: [Purchases]
      summary: Initiate a purchase
      description: |
        Initiates a purchase for either a course OR a bundle (XOR constraint).
        Maps to `finance.purchases`. DB CHECK constraint enforces:
        exactly one of `course_id` or `bundle_id` must be non-null.

        **Server-side resolution:** The `payment_gateway_id` (NOT NULL in DB) is
        resolved server-side to the active Telebirr gateway. Clients do not provide this.

        On completion with `bundle_id`, trigger `create_bundle_enrollments()` fires.
      operationId: initiatePurchase
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PurchaseInitiateRequest'
      responses:
        '201':
          description: Purchase initiated
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SingleResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/Purchase'
        '400':
          $ref: '#/components/responses/400'
        '401':
          $ref: '#/components/responses/401'
        '403':
          $ref: '#/components/responses/403'
        '409':
          $ref: '#/components/responses/409'
        '422':
          $ref: '#/components/responses/422'
        '429':
          $ref: '#/components/responses/429'
        '500':
          $ref: '#/components/responses/500'

