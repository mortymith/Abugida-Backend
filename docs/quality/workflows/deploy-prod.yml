# QGS-001 §7.1 — production deploy (G4/G5). Never cancels.
# Environment `production` protection (§11.2): 2 required reviewers, 10 min wait.
name: deploy-prod

on:
  push:
    branches: [master]

concurrency:
  group: deploy-prod
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  release-readiness:
    # G4 — release readiness gate.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pdm-project/setup-devbox@main
      - run: devbox run -- pnpm install --frozen-lockfile
      - run: devbox run -- pnpm typecheck
      - run: devbox run -- pnpm test
      - name: Waiver check
        run: node tooling/quality/waiver-check.mjs

  image-scan:
    # QG-404 — zero-tolerance image scan before promotion.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: aquasecurity/trivy-action@0.28.0
        with:
          scan-type: fs
          severity: CRITICAL
          exit-code: '1'
          ignore-unfixed: true

  deploy:
    needs: [release-readiness, image-scan]
    environment: production # 2 reviewers + 10 min wait timer (§11.2)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Deploy to production
        run: |
          echo "Production deploy hook — wire the real deployment command here"
          echo "Any workflow needing a real secret MUST use the 'production' environment (§7.3)."

  post-deploy-verification:
    needs: deploy
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Post-deploy verification (QG-608)
        run: echo "Run docs/runbooks/deploy/post-deploy-verification.md checks here"
