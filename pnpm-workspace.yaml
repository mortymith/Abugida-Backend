overrides:
  esbuild@<=0.24.2: '>=0.25.0'
  js-yaml@<=5.4.0: '>=5.4.1'
  smol-toml@<=1.8.0: '>=1.9.0'
  katex@<0.18.2: '>=0.18.2'
  # Security overrides for transitive dependencies (see GHSA IDs in pnpm audit)
  hono: '^4.13.16'
  '@hono/node-server': '>=2.1.6'
  minimatch@>=7.0.0 <11.0.1: '>=11.0.1'
  # pnpm otherwise resolves a beta wasm runtime for astro's language server,
  # whose bridge is incompatible with @astrojs/astro2tsx (typecheck crash).
  '@emnapi/core': '1.11.3'
  '@emnapi/runtime': '1.11.3'

packages:
  - 'app/*'
  - 'packages/*'
  - 'tooling/*'

allowBuilds:
  '@google/genai': true
  esbuild: true
  msgpackr-extract: true
  protobufjs: true
  sharp: true
  unrs-resolver: true

minimumReleaseAgeExclude:
  - astro@7.1.4
  - '@tanstack/react-start-client@1.168.23'
  - '@tanstack/react-start-server@1.167.30'
  - '@tanstack/router-generator@1.167.27'

patchedDependencies:
  '@tanstack/react-router@1.170.38': patches/@tanstack__react-router@1.170.38.patch
  eslint-plugin-import-x@4.17.1: patches/eslint-plugin-import-x@4.17.1.patch

audit:
  ignorePrune: true
  ignore:
    # GHSA-gcqx-w48m-w2h4: deepmerge mergeObject() prototype poisoning.
    # No patched release exists (4.3.1 is the latest upstream version). It is
    # reachable only through the dev-only `shadcn` CLI, never shipped to users.
    # Remove this entry once a fixed deepmerge version is published.
    - GHSA-gcqx-w48m-w2h4
