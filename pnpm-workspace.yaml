overrides:
  esbuild@<=0.24.2: '>=0.25.0'
  js-yaml@<=5.4.0: '>=5.4.1'
  smol-toml@<=1.8.0: '>=1.9.0'
  katex@<0.18.2: '>=0.18.2'

packages:
  - 'app/*'
  - 'packages/*'
  - 'tooling/*'

allowBuilds:
  '@google/genai': true
  esbuild: true
  msgpackr-extract: true
  protobufjs: true
  sharp: true
  unrs-resolver: true

minimumReleaseAgeExclude:
  - astro@7.1.4
  - '@tanstack/react-start-client@1.168.23'
  - '@tanstack/react-start-server@1.167.30'
  - '@tanstack/router-generator@1.167.27'

patchedDependencies:
  '@tanstack/react-router@1.170.38': patches/@tanstack__react-router@1.170.38.patch
