# ═══════════════════════════════════════════════════════════════════
# SECURITY — Vault, Secrets Management, Backup (Staging + Production)
# ═══════════════════════════════════════════════════════════════════
#
# Part of modular Docker Compose structure
# Composes with: networks.yml, volumes.yml, base.yml,
#   app.yml, observability.yml, edge.yml, scaling.yml,
#   profiles/prod.override.yml
#
# Included in: Staging + Prod (not Dev)
# Production-only security services:
#   - HashiCorp Vault (ADR-006): dynamic secrets + PKI
#   - MinIO Backup (ADR-012): cross-region/off-site CRR target
#
# Secrets strategy (ADR-006): Vault is the source of truth for all
# production secrets; values are injected as environment variables.
#
# Hardening (every service): no-new-privileges via x-security anchor;
# log rotation capped at 10 MB × 5 files per container via x-logging.
#
# ═══════════════════════════════════════════════════════════════════

x-logging: &default-logging
  driver: json-file
  options:
    max-size: '10m'
    max-file: '5'

x-security: &default-security
  security_opt:
    - no-new-privileges:true

services:
  # ═══════════════════════════════════════════════════════════════════
  # HashiCorp Vault — Dynamic Secrets + PKI (ADR-006; Staging + Production)
  # ═══════════════════════════════════════════════════════════════════
  # Dev bypasses Vault entirely (ADR-006: .env environment variables).
  #
  # Bootstrap sequence:
  #   1. docker compose up -d vault
  #   2. just vault-init
  #   3. just vault-unseal
  #   4. just vault-populate-secrets
  # ═══════════════════════════════════════════════════════════════════
  vault:
    image: hashicorp/vault:1.18
    container_name: ${COMPOSE_PROJECT_NAME:-infra}_vault
    restart: unless-stopped
    <<: *default-security
    logging: *default-logging
    cap_add:
      - IPC_LOCK
    ulimits:
      memlock:
        soft: -1
        hard: -1
    environment:
      VAULT_ADDR: 'https://127.0.0.1:8200'
      VAULT_API_ADDR: 'https://vault:8200'
      VAULT_SKIP_VERIFY: '1'
    volumes:
      - vault_data:/vault/file
      - ./docker/config/vault/vault-config.hcl:/vault/config/vault-config.hcl:ro
      - ./docker/config/vault/scripts:/vault/scripts:ro
      - ./docker/config/vault/policies:/vault/policies:ro
      - ./data/vault/tls:/vault/tls
    # NOTE: do not pass -config here — docker-entrypoint.sh already prepends
    # -config=/vault/config (directory load); repeating the file would parse
    # the listener twice and fail with "bind: address already in use".
    command: server
    networks:
      - infrastructure
    healthcheck:
      test: ['CMD', 'vault', 'status']
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s

  # ═══════════════════════════════════════════════════════════════════
  # MinIO Backup Target (ADR-012)
  # ═══════════════════════════════════════════════════════════════════
  # Receives CRR traffic from the primary MinIO. Runs as a separate instance
  # to simulate cross-region / off-site replication.
  # ═══════════════════════════════════════════════════════════════════
  minio-backup:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    container_name: ${COMPOSE_PROJECT_NAME:-infra}_minio-backup
    restart: unless-stopped
    <<: *default-security
    logging: *default-logging
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD is required (export from Vault)}
    volumes:
      - minio_backup_data:/data
    networks:
      - infrastructure
    healthcheck:
      test: ['CMD', 'curl', '-sf', 'http://localhost:9000/minio/health/live']
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

volumes:
  # Vault persistent storage. Declared here (not in the tier
  # overrides) so the volume exists for both Staging and Production, which
  # both include this security layer (ADR-006). TLS material lives in
  # ./data/vault/tls (host-generated by init-vault-tls.sh, bind-mounted).
  vault_data:
    name: ${COMPOSE_PROJECT_NAME:-infra}_vault_data
  # Off-site / cross-region CRR target (ADR-012). Declared here so the
  # volume exists whenever security.yml (Staging + Prod) is included.
  minio_backup_data:
    name: ${COMPOSE_PROJECT_NAME:-infra}_minio_backup_data
