# PostgreSQL Client Authentication (pg_hba.conf)
# Source: deployment.md v3.0.0, ADR-002, ADR-019
#
# Order matters: first matching rule wins.
# In production, restrict SOURCE IPs to specific subnet ranges.

# ─── Local connections (Unix socket) ───────────────────────────────────────────
# trust (not peer): the official image's first-boot init connects over the
# socket as POSTGRES_USER (app) while running as OS user postgres — peer's
# OS-user==DB-user requirement fails there and aborts every init script.
local   all             all                                     trust

# ─── Replication connections (streaming) ──────────────────────────────────────
# Replicator user from any container on the infrastructure network
host    replication     replicator      172.22.0.0/24           scram-sha-256

# ─── Replication connections (logical, PowerSync) ─────────────────────────────
# PowerSync requires direct Postgres access (bypasses PgBouncer).
# See docs/services/powersync.md for rationale.
host    replication     powersync       172.22.0.0/24           scram-sha-256

# ─── PowerSync regular connections ──────────────────────────────────────────────
# Non-replication traffic: schema reads (replication role) and bucket-storage
# SQL (storage role). Both roles connect directly to postgres-primary.
host    all             powersync         172.22.0.0/24         scram-sha-256
host    all             powersync_storage 172.22.0.0/24         scram-sha-256

# ─── SigNoz metadata connections ────────────────────────────────────────────
# SigNoz reaches Postgres through PgBouncer (SCRAM pass-through), so the
# connection arrives from the pgbouncer container on this subnet as the
# "signoz" role.
host    all             signoz            172.22.0.0/24         scram-sha-256

# ─── Application connections via PgBouncer (ADR-019) ──────────────────────────
# PgBouncer lives on the infrastructure network and connects as the app user
host    all             app             172.22.0.0/24           scram-sha-256

# ─── PgBouncer admin (auth_user) ──────────────────────────────────────────────
# auth_query lookups target the CLIENT's database (e.g. app), not a db named
# "pgbouncer", so the rule must allow all databases.
host    all             pgbouncer       172.22.0.0/24           scram-sha-256

# ─── 3.5 Fix: Localhost access restricted to named users only ───────────────
# Prevents "any user" from connecting via localhost
# (peer is valid only on Unix sockets — TCP lines must use scram-sha-256)
host    all             app             127.0.0.1/32            scram-sha-256
host    all             app             ::1/128                 scram-sha-256
host    all             postgres        127.0.0.1/32            scram-sha-256
host    all             postgres        ::1/128                 scram-sha-256