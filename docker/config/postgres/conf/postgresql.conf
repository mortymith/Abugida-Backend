# PostgreSQL 17 Configuration — Primary
# Source: deployment.md v3.0.0, ADR-002, ADR-005, ADR-015
#
# This file is bind-mounted into the postgres-primary container.
# Replica-specific overrides live in replica.conf (included below).

# ─── Connection Settings ─────────────────────────────────────────────────────
listen_addresses = '*'
port = 5432
max_connections = 200

# ─── Memory (tuned for container; override in .prod.yml via deploy.resources) ──
shared_buffers = 256MB
work_mem = 16MB
maintenance_work_mem = 128MB
effective_cache_size = 768MB

# ─── WAL & Replication (ADR-002: Streaming Replication, PowerSync: Logical Decoding) ──
# wal_level=logical supports both streaming replication AND logical decoding
# required by PowerSync. This is a superset of 'replica' — no compatibility loss.
wal_level = logical
max_wal_senders = 12
max_replication_slots = 14
wal_keep_size = 2GB
hot_standby = on
synchronous_commit = on

# ─── WAL Archiving (§9: PITR support) ──────────────────────────────────────────
# Paths live under PGDATA so they are postgres-writable inside the container.
archive_mode = on
archive_command = 'test ! -f /var/lib/postgresql/data/wal_archive/%f && cp %p /var/lib/postgresql/data/wal_archive/%f'
archive_timeout = 300

# ─── Logging ───────────────────────────────────────────────────────────────────
logging_collector = on
log_directory = '/var/lib/postgresql/data/log'
log_filename = 'postgresql-%Y-%m-%d.log'
log_rotation_age = 1d
log_rotation_size = 100MB
log_min_duration_statement = 500
log_line_prefix = '%t [%p]: db=%d,user=%u,app=%a,client=%h '
log_checkpoints = on
log_connections = on
log_disconnections = on
log_lock_waits = on

# ─── Query Tuning ──────────────────────────────────────────────────────────────
random_page_cost = 1.1
effective_io_concurrency = 200

# ─── Checkpoints ───────────────────────────────────────────────────────────────
checkpoint_completion_target = 0.9
min_wal_size = 1GB
max_wal_size = 4GB

# ─── Autovacuum ────────────────────────────────────────────────────────────────
autovacuum = on
autovacuum_max_workers = 3
autovacuum_naptime = 30s

# ─── Authentication ───────────────────────────────────────────────────────────
# 4.13 Fix: Explicitly set password encryption (PG 17 default, explicit for audit)
password_encryption = scram-sha-256

# ─── Locale (Alpine lacks system locales; suppress the startup warning
#      by pinning to C.UTF-8, which is available in the base image) ──────────
lc_messages = 'C.UTF-8'
lc_monetary = 'C.UTF-8'
lc_numeric = 'C.UTF-8'
lc_time = 'C.UTF-8'

# NOTE: Replica-specific overrides are in config/postgres/conf/replica.conf.
# The replica Dockerfile appends 'include = replica.conf' at startup.
