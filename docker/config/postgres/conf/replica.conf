# PostgreSQL 17 Replica Overrides
# Source: deployment.md v3.0.0, ADR-002
#
# Appended to postgresql.conf when the container runs as a replica.
# The postgres-replica Dockerfile copies this file and adds
# 'include = /var/lib/postgresql/data/replica.conf' before startup.

# ─── Replica Mode ─────────────────────────────────────────────────────────────
# The primary_standby setting is NOT used — the replica Dockerfile
# uses pg_basebackup + recovery.signal instead (see docker/dockerfiles/postgres-replica/).

hot_standby = on
hot_standby_feedback = on

# ─── Replica Query Tuning ─────────────────────────────────────────────────────
# Favor read workloads; replicas serve read queries distributed via
# PgBouncer's read pool.
effective_cache_size = 512MB
random_page_cost = 1.1

# ─── WAL Receiver ─────────────────────────────────────────────────────────────
wal_receiver_status_interval = 10s
wal_receiver_timeout = 60s

# ─── Logging (replica-specific) ───────────────────────────────────────────────
log_line_prefix = '%t [%p]: replica db=%d,user=%u,app=%a,client=%h '
