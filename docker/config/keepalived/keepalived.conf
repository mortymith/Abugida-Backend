# ═════════════════════════════════════════════════════════
# Keepalived Configuration (ADR-011)
# ═════════════════════════════════════════════════════════
# Manages floating VIP 172.20.0.100 on the edge network.
# Active health-checks caddy-standby; standby health-checks caddy-active.
# Failover < 5s (advert_int 1s, vrrp_garp_master_delay 1s).
#
# C-04 Fix: auth_pass is now set via environment variable with
# pre-flight validation. The placeholder below is replaced by
# scripts/setup/setup-prod.sh at deployment time.
# Phase 8 Fix: VRRP_INTERFACE is resolved dynamically from the
# Docker edge network bridge name at deployment time.
# ═════════════════════════════════════════════════════════

global_defs {
    vrrp_garp_master_delay 1
    vrrp_garp_master_refresh 5
    # Phase 8 Fix: Interface resolved from Docker network inspect
    interface ${VRRP_INTERFACE:-eth0}
    script_user root
    enable_script_security
}

# ── VRRP Instance: Edge VIP ─────────────────────────────────────
vrrp_instance VI_EDGE {
    state MASTER
    interface ${VRRP_INTERFACE:-eth0}
    virtual_router_id 51
    priority 100
    advert_int 1
    # C-04 Fix: Strong random password set at deploy time
    authentication {
        auth_type PASS
        auth_pass ${KEEPALIVED_AUTH_PASS:-CHANGE_ME_GENERATE_32_CHARS}
    }
    virtual_ipaddress {
        172.20.0.100/24
    }

    # Track Caddy health
    track_script {
        chk_caddy_active
    }
}

# ── Health Check Scripts ─────────────────────────────────────────
# Check if active Caddy is healthy via Docker API
vrrp_script chk_caddy_active {
    script "/usr/bin/curl -sf http://127.0.0.1:80/health"
    interval 2
    weight -20
    fall 3
    rise 2
}
