# ═════════════════════════════════════════════════════════════════════════════════
# Redis Server Configuration
# Source: deployment.md v3.0.0 §5.3, ADR-014, ADR-022
#
# Hardened production-grade config. Dev overlay overrides memory downwards.
# ═════════════════════════════════════════════════════════════════════════════════

# ── Network ──────────────────────────────────────────────────────────────────
bind 0.0.0.0
tcp-backlog 511
timeout 0
tcp-keepalive 300
# Docker network isolation replaces protected-mode (no inline comments —
# redis.conf does not support trailing comments on directive lines)
protected-mode no
# 3.1 Fix: Disable non-TLS port when REDIS_TLS_ENABLED=1
# (entrypoint.sh flips these two lines for plain-text mode)
port 0
tls-port 6379

# ── General ──────────────────────────────────────────────────────────────────
daemonize no
supervised auto
pidfile /var/run/redis/redis-server.pid
loglevel notice
logfile ""
databases 16

# ── Memory ───────────────────────────────────────────────────────────────────
# Default 2gb; dev overlay overrides via --maxmemory flag or env.
maxmemory 2gb
maxmemory-policy allkeys-lru
maxmemory-samples 10

# ── Replication ──────────────────────────────────────────────────────────────
# ROLE=primary: replication disabled (master). Set by entrypoint.
# ROLE=replica:  entrypoint appends replicaof directive.
min-replicas-to-write 1
min-replicas-max-lag 10

# ── Persistence ───────────────────────────────────────────────────────────────
save 900 1
save 300 10
save 60 10000
stop-writes-on-bgsave-error yes
rdbcompression yes
rdbchecksum yes
dbfilename dump.rdb
dir /data

# AOF — append-only for durability
appendonly yes
appendfilename "appendonly.aof"
appendfsync everysec
no-appendfsync-on-rewrite no
auto-aof-rewrite-percentage 100
auto-aof-rewrite-min-size 64mb

# ── Slow Log ──────────────────────────────────────────────────────────────────
slowlog-log-slower-than 10000
slowlog-max-len 128

# ── Client ───────────────────────────────────────────────────────────────────
maxclients 10000

# ── Client Output Buffer Limits ───────────────────────────────────────────────
client-output-buffer-limit normal 0 0 0
client-output-buffer-limit replica 256mb 64mb 60
client-output-buffer-limit pubsub 32mb 8mb 60

# ── Security — Dangerous Commands Disabled ────────────────────────────────────
# 4.14 Fix: CONFIG also renamed to empty string at protocol level
# FLUSHALL, FLUSHDB, DEBUG are renamed to empty string (disabled).
rename-command FLUSHALL ""
rename-command FLUSHDB ""
rename-command DEBUG ""
rename-command CONFIG ""
rename-command SHUTDOWN ""

# ── ACL ───────────────────────────────────────────────────────────────────────
# Load ACL rules from external file (mount: ./config/redis/users.acl)
aclfile /usr/local/etc/redis/users.acl

# ── TLS (3.1 Fix: Enabled via env-var toggle, ADR-014) ────────────────────────
# When REDIS_TLS_ENABLED is set (via entrypoint), the entrypoint appends
# the TLS directives. When unset, the entrypoint switches port/tls-port
# so plain port 6379 is active and tls-port is disabled.
# Certificates are expected at /etc/redis/tls/ (bind-mounted or Vault-provisioned).

# ── Lua Scripting ────────────────────────────────────────────────────────────
lua-time-limit 5000
