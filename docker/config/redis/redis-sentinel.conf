# ═════════════════════════════════════════════════════════════════════════════════
# Redis Sentinel Configuration
# Source: deployment.md v3.0.0 §5.3, ADR-022
#
# Base config — SENTINEL MONITOR line is injected at runtime by init-redis.sh
# so that the primary hostname is dynamic (depends_on resolution).
# ═════════════════════════════════════════════════════════════════════════════════

# ── General ──────────────────────────────────────────────────────────────────
port 26379
daemonize no
pidfile /var/run/redis/redis-sentinel.pid
dir /tmp
loglevel notice
logfile ""

# ── Sentinel Settings ────────────────────────────────────────────────────────
sentinel down-after-milliseconds mymaster 5000
sentinel failover-timeout mymaster 10000
sentinel parallel-syncs mymaster 1

# quorum is set in the SENTINEL MONITOR line below (default: 2)
# sentinel monitor mymaster <primary-ip> 6379 <quorum>
sentinel monitor mymaster 127.0.0.1 6379 2

# ── Resolution ───────────────────────────────────────────────────────────────
resolve-hostnames no

# ── Auth ─────────────────────────────────────────────────────────────────────
# Sentinel connects to Redis instances using the sentinel user.
# Password is passed at runtime via init-redis.sh SENTINEL SET commands.
# sentinel auth-pass mymaster <password>

# ── Notification & Script (optional, configured in later phases) ────────────
# sentinel notification-script mymaster /etc/redis/scripts/notify.sh
# sentinel client-reconfig-script mymaster /etc/redis/scripts/reconfig.sh
