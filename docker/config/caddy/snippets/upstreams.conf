# ═══════════════════════════════════════════════════════════════════════════════
# Caddy Upstreams — Dynamic (rewritten by dynamic-upstream.sh)
# ═════════════════════════════════════════════════════════════════════════════════
#
# C-03 Fix: Upstreams now support weighted traffic distribution
# for blue-green deployments. The dynamic-upstream.sh script generates
# weighted upstreams using Caddy's lb_weight directive.
#
# DO NOT hardcode upstream IPs elsewhere.
# This file is the single source of truth for backend targets.
#
# ═════════════════════════════════════════════════════════════════════════════════

# API upstream — load balanced across replicas with weights
set_upstream api {
    upstream api:3000
}

# Dashboard upstream — load balanced across replicas with weights
set_upstream dashboard {
    upstream dashboard:8080
}

# Marketing upstream — load balanced across replicas with weights
set_upstream marketing {
    upstream marketing:8080
}

# PowerSync upstream — client sync API (stateless api role).
# powersync-sync is NOT proxied here: it is the singleton replication worker.
set_upstream powersync {
    upstream powersync-api:8085
}
