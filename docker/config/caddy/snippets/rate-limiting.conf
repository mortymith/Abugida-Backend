# Caddy Rate Limiting
# ═════════════════════════════════════════════════════════════════════

# Global rate limiting — 100 requests/second per IP, burst 200
rate_limit {
    zone dynamic {
        key {client_ip}
        events 100
        window 1s
        burst 200
    }
}

# Stricter limits on API endpoints — 50 req/s, burst 100
rate_limit api_zone {
    zone dynamic {
        key {client_ip}
        events 50
        window 1s
        burst 100
    }
}
