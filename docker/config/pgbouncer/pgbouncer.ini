[databases]
# Source: deployment.md v3.0.0, ADR-019
# Format: dbname = host=port user=...
#
# Writes go through the primary; reads are distributed.
# PgBouncer does NOT do read/write splitting itself — that's handled
# by the application (API + Dashboard write via PgBouncer).
# PgBouncer's role is connection pooling (reduces PG connection overhead 80%+).

# Application database — primary (writes)
app = host=postgres-primary port=5432

# SigNoz metadata database (ADR-003) — alerts, dashboards, org config.
# SigNoz connects as its own "signoz" role through the pooler.
signoz = host=postgres-primary port=5432

# ─────────────────────────────────────────────────────────────────────
[pgbouncer]

# ─── Connection Pooling (ADR-019) ────────────────────────────────────────
# Literal values — PgBouncer does NOT perform ${VAR} environment substitution
# in config files (shell-style placeholders make it fail config load).
# Tune via this file; compose PGBOUNCER_* env vars are informational only.
pool_mode = transaction
max_client_conn = 100
default_pool_size = 20
min_pool_size = 5
reserve_pool_size = 10
reserve_pool_timeout = 3
# Track server-side prepared statements so transaction pooling stays
# compatible with clients that use them (SigNoz/GORM does). Requires
# PgBouncer >= 1.21; without this, prepared statements randomly fail
# with "prepared statement does not exist" under transaction mode.
max_prepared_statements = 200

# ─── Connection Settings ────────────────────────────────────────────────
# 2.10 Fix: Listen on all interfaces — containers connect via Docker DNS.
# Access is restricted at the network level (infrastructure network only).
listen_addr = 0.0.0.0
listen_port = 6432
unix_socket_dir = /tmp

# ─── Authentication ────────────────────────────────────────────────────
# H-05 Fix: scram-sha-256 end-to-end (client → pgbouncer → postgres-primary).
#
# Flow (SCRAM pass-through):
#   1. docker/init/init-pgbouncer.sh (pgbouncer-init one-shot job) copies
#      each connecting user's SCRAM verifier VERBATIM from pg_authid into
#      userlist.txt at container start — PostgreSQL generates every hash;
#      none are stored in git.
#   2. Clients authenticate to pgbouncer via SCRAM against that verifier.
#   3. pgbouncer forwards SCRAM to postgres-primary using the keys from
#      the same verifier.
#
# NOTE: auth_query is deliberately NOT used. PgBouncer cannot perform
# SCRAM pass-through for secrets obtained via auth_query ("password is
# SCRAM secret but client authentication did not provide SCRAM keys") —
# pass-through only works with auth_file. Rotation: re-run pgbouncer-init,
# then reload pgbouncer (SIGHUP) — see docs/services/postgres.md.
auth_type = scram-sha-256
auth_file = /etc/pgbouncer/auth/userlist.txt

# ─── Timeouts ──────────────────────────────────────────────────────────
server_idle_timeout = 600
server_lifetime = 3600
server_connect_timeout = 15
server_reset_query = DISCARD ALL
client_idle_timeout = 0
client_login_timeout = 60

# ─── Logging ────────────────────────────────────────────────────────────
log_connections = 1
log_disconnections = 1
log_pooler_errors = 1
verbose = 0

# ─── Admin ─────────────────────────────────────────────────────────────
admin_users = pgbouncer
stats_period = 60

# ─── Safety ────────────────────────────────────────────────────────────
ignore_startup_parameters = extra_float_digits,geqo,search_path
